# Keep runtime dependencies and Actions pinned through reviewable PRs.
# Actions are pinned to full commit SHAs in the workflow files; this
# github-actions config is what advances those pins (SHA + version
# comment) as grouped weekly PRs. Do not reintroduce bare tags.
# Grouped updates minimize CI load across the large workflow inventory.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    groups:
      python-runtime:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
