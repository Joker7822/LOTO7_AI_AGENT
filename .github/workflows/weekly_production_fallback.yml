name: Weekly Production Fallback

on:
  schedule:
    # Fallback inside the Friday 13:00-15:00 JST publication window.
    # 05:00 UTC = 14:00 JST. The canonical publisher is idempotent by target round.
    - cron: "0 5 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loto7-production-publisher
  cancel-in-progress: false

jobs:
  publish-production-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Tokyo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Gate Production publication window
        id: publication_gate
        shell: bash
        run: |
          set -euo pipefail

          DOW=$(TZ=Asia/Tokyo date +%u)
          HM=$(TZ=Asia/Tokyo date +%H%M)

          ALREADY_PUBLISHED=$(python3 - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          path = Path("loto7_agent_output/weekly_production_prediction_state.json")
          if not path.exists():
              print("false")
              raise SystemExit

          try:
              state = json.loads(path.read_text(encoding="utf-8"))
          except Exception:
              print("false")
              raise SystemExit

          today = datetime.now(timezone(timedelta(hours=9))).date().isoformat()
          published_at = str(state.get("published_at_jst", ""))
          print("true" if state.get("published") is True and published_at.startswith(today) else "false")
          PY
          )

          if [ "${ALREADY_PUBLISHED}" = "true" ]; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "[PRODUCTION-FALLBACK] today's Production is already published; clean no-op"
            exit 0
          fi

          if [ "${DOW}" != "5" ] || [ "${HM}" -lt 1300 ]; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "::error::Production fallback triggered outside Friday publication window"
            exit 1
          fi

          if [ "${HM}" -ge 1500 ]; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "::error::Production was not published before the 15:00 JST fail-closed cutoff"
            exit 1
          fi

          echo "publish=true" >> "${GITHUB_OUTPUT}"
          echo "[PRODUCTION-FALLBACK] publication allowed inside Friday 13:00-14:59 JST"

      - name: Set up Python
        if: steps.publication_gate.outputs.publish == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.publication_gate.outputs.publish == 'true'
        run: python -m pip install -r requirements.txt

      - name: Refresh trusted source
        if: steps.publication_gate.outputs.publish == 'true'
        run: |
          python fetch_validate.py \
            --csv loto7.csv \
            --report loto7_agent_output/source_validation.json \
            --max-attempts 1 \
            --interval-seconds 0 \
            --months 3

      - name: Freeze or safely republish canonical Production
        if: steps.publication_gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$(git rev-parse HEAD)" python weekly_production_prediction.py \
            --csv loto7.csv \
            --out-dir loto7_agent_output \
            --champion-file loto7_agent_output/model_champion.json \
            --research-state loto7_agent_output/v4_research_state.json \
            --min-train 100

      - name: Reconcile canonical ledger
        if: steps.publication_gate.outputs.publish == 'true'
        run: |
          python audit_ledger.py \
            --loto-csv loto7.csv \
            --tickets-csv loto7_agent_output/candidate_tickets.csv \
            --out-dir loto7_agent_output \
            --status-md STATUS.md

      - name: Commit Production checkpoint
        if: steps.publication_gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "loto7-ai-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain -- loto7.csv STATUS.md loto7_agent_output)" ]; then
            git add -- loto7.csv STATUS.md loto7_agent_output
            TARGET=$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path('loto7_agent_output/weekly_production_prediction_state.json')
          obj = json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          print(obj.get('target_round', 'unknown'))
          PY
            )
            git commit -m "chore: weekly Production fallback ${TARGET}"
            git pull --rebase
            git push
          else
            echo "[PRODUCTION-FALLBACK] canonical Production already current"
          fi

      - name: Validate Sakura sync payload
        if: steps.publication_gate.outputs.publish == 'true'
        run: |
          python -m py_compile prediction_db_sync.py
          python prediction_db_sync.py --dry-run --output /tmp/sakura_payload.json
          python - <<'PY'
          import json
          p = json.load(open('/tmp/sakura_payload.json', encoding='utf-8'))
          assert p['schema_version'] == 'loto7-db-sync-v1'
          print(f"payload predictions={len(p['predictions'])} results={len(p['results'])}")
          PY

      - name: Sync Production to Sakura MySQL
        if: steps.publication_gate.outputs.publish == 'true'
        env:
          SAKURA_PREDICTION_API_URL: https://www.epic-creation.com/Epic/Epic-Creation/sakura_loto7_php/prediction_ingest.php
          SAKURA_PREDICTION_HMAC_SECRET: ${{ secrets.SAKURA_PREDICTION_HMAC_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SAKURA_PREDICTION_HMAC_SECRET:-}" ]; then
            echo "SAKURA_PREDICTION_HMAC_SECRET is not configured; refusing silent skip"
            exit 1
          fi
          python prediction_db_sync.py

      - name: Show Production state
        if: always() && steps.publication_gate.outputs.publish == 'true'
        run: |
          if [ -f loto7_agent_output/weekly_production_prediction_state.json ]; then
            cat loto7_agent_output/weekly_production_prediction_state.json
          fi
