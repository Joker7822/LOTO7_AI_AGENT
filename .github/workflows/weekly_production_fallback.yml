name: Weekly Production Fallback

on:
  schedule:
    # Fallback for the primary 15:00 JST publisher.
    # 06:12 UTC = 15:12 JST. The canonical publisher is idempotent by target round.
    - cron: "12 6 * * 5"

permissions:
  contents: write

concurrency:
  group: weekly-production-fallback
  cancel-in-progress: false

jobs:
  publish-production-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Tokyo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh trusted source
        run: |
          python fetch_validate.py \
            --csv loto7.csv \
            --report loto7_agent_output/source_validation.json \
            --max-attempts 1 \
            --interval-seconds 0 \
            --months 3

      - name: Freeze or safely republish canonical Production
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$(git rev-parse HEAD)" python weekly_production_prediction.py \
            --csv loto7.csv \
            --out-dir loto7_agent_output \
            --champion-file loto7_agent_output/model_champion.json \
            --research-state loto7_agent_output/v4_research_state.json \
            --min-train 100

      - name: Reconcile canonical ledger
        run: |
          python audit_ledger.py \
            --loto-csv loto7.csv \
            --tickets-csv loto7_agent_output/candidate_tickets.csv \
            --out-dir loto7_agent_output \
            --status-md STATUS.md

      - name: Commit Production checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "loto7-ai-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain -- loto7.csv STATUS.md loto7_agent_output)" ]; then
            git add -- loto7.csv STATUS.md loto7_agent_output
            TARGET=$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path('loto7_agent_output/weekly_production_prediction_state.json')
          obj = json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          print(obj.get('target_round', 'unknown'))
          PY
            )
            git commit -m "chore: weekly Production fallback ${TARGET}"
            git pull --rebase
            git push
          else
            echo "[PRODUCTION-FALLBACK] canonical Production already current"
          fi

      - name: Validate Sakura sync payload
        run: |
          python -m py_compile prediction_db_sync.py
          python prediction_db_sync.py --dry-run --output /tmp/sakura_payload.json
          python - <<'PY'
          import json
          p = json.load(open('/tmp/sakura_payload.json', encoding='utf-8'))
          assert p['schema_version'] == 'loto7-db-sync-v1'
          print(f"payload predictions={len(p['predictions'])} results={len(p['results'])}")
          PY

      - name: Sync Production to Sakura MySQL
        env:
          SAKURA_PREDICTION_API_URL: https://www.epic-creation.com/Epic/Epic-Creation/sakura_loto7_php/prediction_ingest.php
          SAKURA_PREDICTION_HMAC_SECRET: ${{ secrets.SAKURA_PREDICTION_HMAC_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SAKURA_PREDICTION_HMAC_SECRET:-}" ]; then
            echo "SAKURA_PREDICTION_HMAC_SECRET is not configured; refusing silent skip"
            exit 1
          fi
          python prediction_db_sync.py

      - name: Show Production state
        if: always()
        run: |
          if [ -f loto7_agent_output/weekly_production_prediction_state.json ]; then
            cat loto7_agent_output/weekly_production_prediction_state.json
          fi
