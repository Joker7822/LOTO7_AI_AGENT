name: Joint Set v2 Signal Future OOS

on:
  pull_request:
    paths:
      - ".github/workflows/joint_set_v2_signal_oos.yml"
      - "joint_set_v2_signal_oos.py"
      - "joint_set_v2_signal_oos_guard.py"
      - "tests/test_joint_set_v2_signal_oos_guard.py"
      - "joint_set_v2_model.py"
      - "joint_set_v2_research.py"
      - "tests/test_joint_set_v2_signal_oos.py"
      - "JOINT_SET_V2_SIGNAL_OOS.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/joint_set_v2_signal_oos.yml"
      - "joint_set_v2_signal_oos.py"
      - "joint_set_v2_signal_oos_guard.py"
      - "tests/test_joint_set_v2_signal_oos_guard.py"
      - "joint_set_v2_model.py"
      - "joint_set_v2_research.py"
      - "loto7.csv"
      - "loto7_agent_output/source_validation.json"
      - "tests/test_joint_set_v2_signal_oos.py"
      - "JOINT_SET_V2_SIGNAL_OOS.md"
  schedule:
    # Daily 10:15 JST. Source-validation/data pushes also trigger immediately.
    - cron: "15 1 * * *"
  workflow_run:
    workflows: ["LOTO7 Independent Result Corroboration"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: joint-set-v2-signal-future-oos
  cancel-in-progress: false

jobs:
  freeze-grade:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Tokyo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Verify prospective signal protocol
        run: |
          python -m compileall -q \
            joint_set_v2_signal_oos.py joint_set_v2_signal_oos_guard.py \
            joint_set_v2_model.py joint_set_v2_research.py \
            tests/test_joint_set_v2_signal_oos.py tests/test_joint_set_v2_signal_oos_guard.py
          python -m pytest -q tests/test_joint_set_v2_signal_oos.py tests/test_joint_set_v2_signal_oos_guard.py

      - name: Dry-run registration on pull request
        if: github.event_name == 'pull_request'
        run: |
          python joint_set_v2_signal_oos_guard.py --csv loto7.csv --source-report loto7_agent_output/source_validation.json --out-dir loto7_agent_output
          rm -rf /tmp/joint-set-v2-signal-oos
          python joint_set_v2_signal_oos.py \
            --csv loto7.csv \
            --out-dir /tmp/joint-set-v2-signal-oos \
            --source-report loto7_agent_output/source_validation.json \
            --model-file joint_set_v2_model.py \
            --research-file joint_set_v2_research.py \
            --min-train 100 \
            --selection-window 120
          test -f /tmp/joint-set-v2-signal-oos/joint_set_v2_signal_oos_registration.json
          test ! -f /tmp/joint-set-v2-signal-oos/joint_set_v2_signal_oos_registry.json

      - name: Freeze grade and persist
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "loto7-ai-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for ATTEMPT in 1 2 3 4 5; do
            echo "[V2-SIGNAL-OOS] persist attempt ${ATTEMPT}/5"
            git fetch origin main
            git reset --hard origin/main

            python joint_set_v2_signal_oos_guard.py \
              --csv loto7.csv \
              --source-report loto7_agent_output/source_validation.json \
              --out-dir loto7_agent_output

            python joint_set_v2_signal_oos.py \
              --csv loto7.csv \
              --out-dir loto7_agent_output \
              --source-report loto7_agent_output/source_validation.json \
              --model-file joint_set_v2_model.py \
              --research-file joint_set_v2_research.py \
              --min-train 100 \
              --selection-window 120

            git add -A -- \
              loto7_agent_output/joint_set_v2_signal_oos_registration.json \
              loto7_agent_output/joint_set_v2_signal_oos_state.json \
              loto7_agent_output/joint_set_v2_signal_oos_summary.json \
              loto7_agent_output/joint_set_v2_signal_oos_report.md
            for P in \
              loto7_agent_output/joint_set_v2_signal_oos_registry.json \
              loto7_agent_output/joint_set_v2_signal_oos_freeze_history.jsonl \
              loto7_agent_output/joint_set_v2_signal_oos_results.csv; do
              if [ -e "$P" ]; then
                git add -A -- "$P"
              fi
            done

            if [ -z "$(git status --porcelain -- \
              loto7_agent_output/joint_set_v2_signal_oos_registration.json \
              loto7_agent_output/joint_set_v2_signal_oos_registry.json \
              loto7_agent_output/joint_set_v2_signal_oos_state.json \
              loto7_agent_output/joint_set_v2_signal_oos_results.csv \
              loto7_agent_output/joint_set_v2_signal_oos_freeze_history.jsonl \
              loto7_agent_output/joint_set_v2_signal_oos_summary.json \
              loto7_agent_output/joint_set_v2_signal_oos_report.md)" ]; then
              echo "No v2 signal OOS changes."
              exit 0
            fi

            git commit -m "chore: update Joint Set v2 signal Future-OOS"
            if git push origin HEAD:main; then
              echo "[V2-SIGNAL-OOS] persisted successfully"
              exit 0
            fi
            echo "[V2-SIGNAL-OOS] main moved during push; recomputing from latest main"
          done

          echo "Joint Set v2 signal OOS state could not be persisted after 5 attempts." >&2
          exit 1

      - name: Show status
        if: always()
        shell: bash
        run: |
          {
            echo '## Joint Set v2 Signal Future-OOS'
            cat loto7_agent_output/joint_set_v2_signal_oos_report.md 2>/dev/null || \
              cat /tmp/joint-set-v2-signal-oos/joint_set_v2_signal_oos_report.md 2>/dev/null || true
            echo
            echo '## Registration'
            cat loto7_agent_output/joint_set_v2_signal_oos_registration.json 2>/dev/null || \
              cat /tmp/joint-set-v2-signal-oos/joint_set_v2_signal_oos_registration.json 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
