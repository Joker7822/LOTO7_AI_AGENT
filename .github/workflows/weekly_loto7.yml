name: Continuous LOTO7 Evolution v3

on:
  schedule:
    # Daily recovery/bootstrap at 02:00 JST (17:00 UTC previous day).
    # A successful run dispatches its successor, so normal operation is continuous.
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: continuous-loto7-evolution
  cancel-in-progress: false

jobs:
  continuous-evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Asia/Tokyo
      CONTINUOUS_WINDOW_SECONDS: 14400

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run regression tests once for this runner
        run: python -m pytest -q

      - name: Run backtests continuously
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "loto7-ai-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          RUNNER_START=$(date +%s)
          LAST_FETCH=0
          ITERATION=0

          while true; do
            NOW=$(date +%s)
            ELAPSED=$((NOW - RUNNER_START))
            if [ "$ELAPSED" -ge "$CONTINUOUS_WINDOW_SECONDS" ]; then
              echo "Continuous runner window completed after ${ELAPSED}s."
              break
            fi

            ITERATION=$((ITERATION + 1))
            ITER_START=$(date +%s)
            ITER_START_JST=$(TZ=Asia/Tokyo date --iso-8601=seconds)
            echo "=== Continuous evolution iteration ${ITERATION} started ${ITER_START_JST} ==="

            # Refresh public results periodically rather than hammering source sites on
            # every research iteration. Friday evening is refreshed more aggressively.
            JST_DOW=$(TZ=Asia/Tokyo date +%u)
            JST_HOUR=$(TZ=Asia/Tokyo date +%H)
            FETCH_INTERVAL=3600
            MAX_ATTEMPTS=1
            RETRY_SECONDS=0
            if [ "$JST_DOW" = "5" ] && [ "$JST_HOUR" -ge 20 ] && [ "$JST_HOUR" -le 21 ]; then
              FETCH_INTERVAL=600
              MAX_ATTEMPTS=10
              RETRY_SECONDS=600
            fi

            NOW=$(date +%s)
            if [ "$LAST_FETCH" -eq 0 ] || [ $((NOW - LAST_FETCH)) -ge "$FETCH_INTERVAL" ]; then
              python fetch_validate.py \
                --csv loto7.csv \
                --report loto7_agent_output/source_validation.json \
                --max-attempts "$MAX_ATTEMPTS" \
                --interval-seconds "$RETRY_SECONDS" \
                --months 3
              LAST_FETCH=$(date +%s)
            else
              echo "Source refresh skipped; using already validated draw data."
            fi

            # Use the current repository HEAD as the provenance SHA for this generation.
            GITHUB_SHA="$(git rev-parse HEAD)" python loto7_v3_runner.py \
              --csv loto7.csv \
              --tickets 5 \
              --mutants 6 \
              --out-dir loto7_agent_output \
              --champion-file loto7_agent_output/model_champion.json \
              --evolution-state loto7_agent_output/evolution_state.json \
              --evolution-history loto7_agent_output/evolution_history.jsonl

            python audit_ledger.py \
              --loto-csv loto7.csv \
              --tickets-csv loto7_agent_output/candidate_tickets.csv \
              --out-dir loto7_agent_output \
              --status-md STATUS.md

            python evolution_status.py \
              --status STATUS.md \
              --state loto7_agent_output/evolution_state.json \
              --evaluation loto7_agent_output/model_evaluation.json

            ITER_END=$(date +%s)
            DURATION=$((ITER_END - ITER_START))
            ITERATION_NO="$ITERATION" DURATION_SECONDS="$DURATION" python - <<'PY'
          import csv
          import datetime as dt
          import json
          import os
          from pathlib import Path

          out = Path("loto7_agent_output")
          metrics = out / "execution_metrics.csv"
          state_path = out / "evolution_state.json"
          state = json.loads(state_path.read_text(encoding="utf-8")) if state_path.exists() else {}
          now = dt.datetime.now(dt.timezone(dt.timedelta(hours=9))).isoformat(timespec="seconds")
          row = {
              "completed_at_jst": now,
              "runner_iteration": os.environ["ITERATION_NO"],
              "generation": state.get("generation", ""),
              "duration_seconds": os.environ["DURATION_SECONDS"],
              "data_sha256": state.get("current_data_sha", ""),
              "champion_version": state.get("champion_version", ""),
              "research_winner": state.get("research_winner", ""),
          }
          fields = list(row)
          exists = metrics.exists() and metrics.stat().st_size > 0
          with metrics.open("a", encoding="utf-8", newline="") as f:
              w = csv.DictWriter(f, fieldnames=fields)
              if not exists:
                  w.writeheader()
              w.writerow(row)

          durations = []
          with metrics.open(encoding="utf-8", newline="") as f:
              for r in csv.DictReader(f):
                  try:
                      durations.append(int(r["duration_seconds"]))
                  except (ValueError, KeyError):
                      pass
          recent = durations[-20:]
          avg = (sum(recent) / len(recent)) if recent else 0.0
          status = Path("STATUS.md")
          text = status.read_text(encoding="utf-8") if status.exists() else "# LOTO7 AI Agent Status\n"
          marker = "\n## Continuous Runtime\n"
          if marker in text:
              text = text.split(marker, 1)[0].rstrip() + "\n"
          section = (
              "\n## Continuous Runtime\n\n"
              f"- 最新1回の実行時間: **{int(os.environ['DURATION_SECONDS'])}秒**\n"
              f"- 直近{len(recent)}回の平均: **{avg:.1f}秒**\n"
              f"- 累積実測回数: **{len(durations)}回**\n"
              "- 実行方式: **完了後、待ち時間なしで次のバックテストを開始**\n"
          )
          status.write_text(text.rstrip() + "\n" + section, encoding="utf-8")
          PY

            git add -- loto7.csv \
              STATUS.md \
              loto7_agent_output/prediction_ranking.csv \
              loto7_agent_output/candidate_tickets.csv \
              loto7_agent_output/expert_backtest.csv \
              loto7_agent_output/agent_state.json \
              loto7_agent_output/model_champion.json \
              loto7_agent_output/model_evaluation.json \
              loto7_agent_output/source_validation.json \
              loto7_agent_output/evolution_state.json \
              loto7_agent_output/evolution_history.jsonl \
              loto7_agent_output/execution_metrics.csv \
              loto7_agent_output/research_candidate_tickets.csv \
              loto7_agent_output/latest_research_prediction.txt \
              loto7_agent_output/predictions.csv \
              loto7_agent_output/actual_results.csv \
              loto7_agent_output/reconciliation.csv \
              loto7_agent_output/prediction_results.txt \
              loto7_agent_output/latest_prediction.txt

            GENERATION=$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('loto7_agent_output/evolution_state.json')
          print(json.loads(p.read_text(encoding='utf-8')).get('generation','unknown'))
          PY
            )
            git commit -m "chore: continuous LOTO7 evolution generation ${GENERATION}"
            git pull --rebase
            git push

            echo "=== iteration ${ITERATION} completed in ${DURATION}s; starting next immediately ==="
          done

      - name: Show latest state
        if: success()
        shell: bash
        run: |
          {
            cat STATUS.md
            echo
            echo '## Latest production prediction'
            echo '```text'
            cat loto7_agent_output/latest_prediction.txt
            echo '```'
            echo
            echo '## Latest evolved research prediction'
            echo '```text'
            cat loto7_agent_output/latest_research_prediction.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch next continuous runner
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Dispatching the next continuous runner."
          gh workflow run weekly_loto7.yml --ref main
