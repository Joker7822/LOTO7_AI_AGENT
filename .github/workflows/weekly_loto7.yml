name: Intraday LOTO7 Evolution v3

on:
  schedule:
    # Four times every day: 02:00 / 08:00 / 14:00 / 20:00 JST
    # UTC equivalents: 17:00 / 23:00 / 05:00 / 11:00
    - cron: "0 5,11,17,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intraday-loto7-evolution
  cancel-in-progress: false

jobs:
  evolve-validate-predict-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      TZ: Asia/Tokyo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run regression tests
        run: python -m pytest -q

      - name: Fetch and validate latest public result
        run: |
          python fetch_validate.py \
            --csv loto7.csv \
            --report loto7_agent_output/source_validation.json \
            --max-attempts 10 \
            --interval-seconds 600 \
            --months 3

      - name: Intraday backtest and continuous evolution
        run: |
          python loto7_v3_runner.py \
            --csv loto7.csv \
            --tickets 5 \
            --mutants 6 \
            --out-dir loto7_agent_output \
            --champion-file loto7_agent_output/model_champion.json \
            --evolution-state loto7_agent_output/evolution_state.json \
            --evolution-history loto7_agent_output/evolution_history.jsonl

      - name: Update append-only prediction and result audit ledgers
        run: |
          python audit_ledger.py \
            --loto-csv loto7.csv \
            --tickets-csv loto7_agent_output/candidate_tickets.csv \
            --out-dir loto7_agent_output \
            --status-md STATUS.md

      - name: Add evolution status
        run: |
          python evolution_status.py \
            --status STATUS.md \
            --state loto7_agent_output/evolution_state.json \
            --evaluation loto7_agent_output/model_evaluation.json

      - name: Show production and research state
        shell: bash
        run: |
          {
            cat STATUS.md
            echo
            echo '## Production prediction (append-only audit target)'
            echo '```text'
            cat loto7_agent_output/latest_prediction.txt
            echo '```'
            echo
            echo '## Latest evolved research prediction'
            echo '```text'
            cat loto7_agent_output/latest_research_prediction.txt
            echo '```'
            echo
            echo '## Recent reconciliation'
            echo '```text'
            tail -n 120 loto7_agent_output/prediction_results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit evolution state
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- loto7.csv STATUS.md loto7_agent_output)" ]; then
            echo "No LOTO7 updates to commit."
            exit 0
          fi

          git config user.name "loto7-ai-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- loto7.csv \
            STATUS.md \
            loto7_agent_output/prediction_ranking.csv \
            loto7_agent_output/candidate_tickets.csv \
            loto7_agent_output/expert_backtest.csv \
            loto7_agent_output/agent_state.json \
            loto7_agent_output/model_champion.json \
            loto7_agent_output/model_evaluation.json \
            loto7_agent_output/source_validation.json \
            loto7_agent_output/evolution_state.json \
            loto7_agent_output/evolution_history.jsonl \
            loto7_agent_output/research_candidate_tickets.csv \
            loto7_agent_output/latest_research_prediction.txt \
            loto7_agent_output/predictions.csv \
            loto7_agent_output/actual_results.csv \
            loto7_agent_output/reconciliation.csv \
            loto7_agent_output/prediction_results.txt \
            loto7_agent_output/latest_prediction.txt

          git commit -m "chore: intraday LOTO7 backtest and continuous evolution"
          git pull --rebase
          git push