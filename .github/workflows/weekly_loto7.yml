name: Weekly LOTO7 Update v2

on:
  schedule:
    # Friday 20:00 JST = Friday 11:00 UTC
    - cron: "0 11 * * 5"
  workflow_dispatch:

# Least privilege: the agent only needs to update repository contents.
permissions:
  contents: write

concurrency:
  group: weekly-loto7-update
  cancel-in-progress: false

jobs:
  update-validate-predict-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      TZ: Asia/Tokyo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run regression tests
        run: python -m pytest -q

      - name: Fetch latest result with freshness gate
        run: |
          python fetch_validate.py \
            --csv loto7.csv \
            --report loto7_agent_output/source_validation.json \
            --max-attempts 10 \
            --interval-seconds 600 \
            --months 3

      - name: Evaluate Champion and Challengers, then generate five predictions
        run: |
          python loto7_v2_runner.py \
            --csv loto7.csv \
            --tickets 5 \
            --out-dir loto7_agent_output \
            --champion-file loto7_agent_output/model_champion.json

      - name: Update append-only audit ledgers and human-readable reports
        run: |
          python audit_ledger.py \
            --loto-csv loto7.csv \
            --tickets-csv loto7_agent_output/candidate_tickets.csv \
            --out-dir loto7_agent_output \
            --status-md STATUS.md

      - name: Show status, latest prediction and recent results
        shell: bash
        run: |
          {
            cat STATUS.md
            echo
            echo '## Latest prediction'
            echo '```text'
            cat loto7_agent_output/latest_prediction.txt
            echo '```'
            echo
            echo '## Recent reconciliation'
            echo '```text'
            tail -n 120 loto7_agent_output/prediction_results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit audited state
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- loto7.csv STATUS.md loto7_agent_output)" ]; then
            echo "No LOTO7 updates to commit."
            exit 0
          fi

          git config user.name "loto7-ai-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- loto7.csv \
            STATUS.md \
            loto7_agent_output/prediction_ranking.csv \
            loto7_agent_output/candidate_tickets.csv \
            loto7_agent_output/expert_backtest.csv \
            loto7_agent_output/agent_state.json \
            loto7_agent_output/model_champion.json \
            loto7_agent_output/model_evaluation.json \
            loto7_agent_output/source_validation.json \
            loto7_agent_output/predictions.csv \
            loto7_agent_output/actual_results.csv \
            loto7_agent_output/reconciliation.csv \
            loto7_agent_output/prediction_results.txt \
            loto7_agent_output/latest_prediction.txt

          git commit -m "chore: update validated LOTO7 model, predictions and audit ledgers"
          git pull --rebase
          git push
