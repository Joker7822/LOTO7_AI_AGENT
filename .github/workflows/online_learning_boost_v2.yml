name: Prospective Online Learning v2 Research

on:
  workflow_dispatch:
  schedule:
    # Independent research check daily, 10:20 JST.
    - cron: "20 1 * * *"
  workflow_run:
    workflows: ["LOTO7 Independent Result Corroboration"]
    types: [completed]
  pull_request:
    paths:
      - "online_learning_boost_v2.py"
      - "tests/test_online_learning_boost_v2.py"
      - "ONLINE_LEARNING_V2.md"
      - ".github/workflows/online_learning_boost_v2.yml"
  push:
    branches: [main]
    paths:
      - "online_learning_boost_v2.py"
      - "tests/test_online_learning_boost_v2.py"
      - "ONLINE_LEARNING_V2.md"
      - ".github/workflows/online_learning_boost_v2.yml"
      - "loto7.csv"
      - "loto7_agent_output/source_validation.json"

permissions:
  contents: read

concurrency:
  group: independent-prospective-online-learning-v2
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core research dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Test synthetic locked future-only online learning
        run: |
          python -m compileall -q online_learning_boost_v2.py tests/test_online_learning_boost_v2.py
          python -m pytest -q tests/test_online_learning_boost_v2.py
          git diff --exit-code -- loto7.csv loto7_agent_output/ research/

  update-research-only:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Freeze and grade only independently verified future draws
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "loto7-ai-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python online_learning_boost_v2.py --repo-root .
            git diff --exit-code -- loto7.csv STATUS.md loto7_agent_output/ \
              continuous_learning_agent.py predictive_expert_agent.py \
              weekly_production_prediction.py
            if [ -f research/online_learning_v2/state.json ]; then
              git add -- research/online_learning_v2/state.json
            fi
            unexpected="$(git diff --cached --name-only | grep -Ev '^research/online_learning_v2/state[.]json$' || true)"
            if [ -n "$unexpected" ]; then
              echo "::error::Unexpected research mutation: $unexpected"
              exit 1
            fi
            if git diff --cached --quiet; then
              echo "No new verified online learning transition."
              exit 0
            fi
            git commit -m "research: append SHA-locked online learning v2 future transition"
            if git push origin HEAD:main; then
              echo "Prospective v2 audit saved."
              exit 0
            fi
          done
          echo "::error::Unable to publish online learning audit"
          exit 1
