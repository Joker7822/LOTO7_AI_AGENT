name: Verify Sakura Credential Rotation

on:
  workflow_dispatch:
    inputs:
      credential_generation:
        description: "Non-secret rotation generation configured on Sakura (example: 2026-09-r1)"
        required: true
        type: string
      db_rotated_at:
        description: "When Sakura MySQL password was rotated (ISO 8601 with timezone)"
        required: true
        type: string
      hmac_rotated_at:
        description: "When HMAC secret was rotated (ISO 8601 with timezone)"
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: verify-sakura-credential-rotation
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SAKURA_PREDICTION_API_URL: ${{ secrets.SAKURA_PREDICTION_API_URL }}
      SAKURA_PREDICTION_HMAC_SECRET: ${{ secrets.SAKURA_PREDICTION_HMAC_SECRET }}
      SAKURA_CREDENTIAL_GENERATION: ${{ inputs.credential_generation }}
      SAKURA_DB_ROTATED_AT: ${{ inputs.db_rotated_at }}
      SAKURA_HMAC_ROTATED_AT: ${{ inputs.hmac_rotated_at }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required GitHub secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SAKURA_PREDICTION_API_URL:-}" || {
            echo "::error::SAKURA_PREDICTION_API_URL is not configured"
            exit 1
          }
          test -n "${SAKURA_PREDICTION_HMAC_SECRET:-}" || {
            echo "::error::SAKURA_PREDICTION_HMAC_SECRET is not configured"
            exit 1
          }

      - name: Validate verifier
        run: |
          python -m py_compile prediction_db_sync.py verify_sakura_rotation.py
          php -l sakura/prediction_ingest.php

      - name: Perform live signed rotation verification
        run: |
          python verify_sakura_rotation.py             --output loto7_agent_output/sakura_credential_rotation_status.json

      - name: Commit public non-secret verification status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "loto7-ai-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            loto7_agent_output/sakura_credential_rotation_status.json \
            sakura/credential_generation.txt
          if git diff --cached --quiet; then
            echo "Credential rotation status already current."
          else
            git commit -m "security: verify Sakura credential rotation"
            git pull --rebase
            git push
          fi

      - name: Close credential exposure follow-up
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          STATE=$(gh issue view 45 --repo "${GITHUB_REPOSITORY}" --json state --jq .state)
          if [ "${STATE}" = "OPEN" ]; then
            gh issue comment 45 --repo "${GITHUB_REPOSITORY}" --body               "Credential rotation verification passed: DB/HMAC rotation was attested after the exposure date, the rotated HMAC authenticated against Sakura, the configured credential generation matched, and Sakura completed a live DB transaction. No secret values are stored in the repository. See loto7_agent_output/sakura_credential_rotation_status.json."
            gh issue close 45 --repo "${GITHUB_REPOSITORY}" --reason completed
          fi
