name: Verify Sakura Credential Rotation

on:
  workflow_dispatch:
    inputs:
      credential_generation:
        description: "Non-secret rotation generation configured on Sakura (example: 2026-09-r1)"
        required: true
        type: string
      db_rotated_at:
        description: "When Sakura MySQL password was rotated (ISO 8601 with timezone)"
        required: true
        type: string
      hmac_rotated_at:
        description: "When HMAC secret was rotated (ISO 8601 with timezone)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: verify-sakura-credential-rotation
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SAKURA_PREDICTION_API_URL: ${{ secrets.SAKURA_PREDICTION_API_URL }}
      SAKURA_PREDICTION_HMAC_SECRET: ${{ secrets.SAKURA_PREDICTION_HMAC_SECRET }}
      SAKURA_CREDENTIAL_GENERATION: ${{ inputs.credential_generation }}
      SAKURA_DB_ROTATED_AT: ${{ inputs.db_rotated_at }}
      SAKURA_HMAC_ROTATED_AT: ${{ inputs.hmac_rotated_at }}

    steps:
      # workflow_dispatch can target a branch other than main. Never publish
      # a verification status from such a branch or mutate the incident state.
      - name: Require main ref for credential rotation verification
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Credential rotation verification must run from main"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required GitHub secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SAKURA_PREDICTION_API_URL:-}" || {
            echo "::error::SAKURA_PREDICTION_API_URL is not configured"
            exit 1
          }
          test -n "${SAKURA_PREDICTION_HMAC_SECRET:-}" || {
            echo "::error::SAKURA_PREDICTION_HMAC_SECRET is not configured"
            exit 1
          }

      - name: Validate verifier
        run: |
          python -m py_compile prediction_db_sync.py verify_sakura_rotation.py
          php -l sakura/prediction_ingest.php

      - name: Perform live signed rotation verification
        run: |
          python verify_sakura_rotation.py             --output loto7_agent_output/sakura_credential_rotation_status.json

      - name: Commit public non-secret verification status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "loto7-ai-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            loto7_agent_output/sakura_credential_rotation_status.json \
            sakura/credential_generation.txt
          if git diff --cached --quiet; then
            echo "Credential rotation status already current."
          else
            git commit -m "security: verify Sakura credential rotation"
            git pull --rebase
            git push
          fi

      # A successful signed empty transaction does NOT establish that the
      # previously leaked DB/HMAC secrets have been revoked, nor that a real
      # Production sync succeeded. Leave issue #45 open until the operator
      # verifies both out-of-band and explicitly closes it.
      - name: Report successful verifier scope and remaining incident work
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Sakura credential verification"
            echo "New HMAC authentication, generation match and live DB transaction passed."
            echo "This is not proof of old-credential revocation or a normal Production sync."
            echo "Keep issue #45 open until the Sakura operator confirms:"
            echo "- The leaked DB password and old HMAC key are revoked"
            echo "- A normal Production sync succeeded, not just a signed empty transaction"
            echo "- The incident checklist was reviewed without publishing secrets"
            echo "Incident: https://github.com/${GITHUB_REPOSITORY}/issues/45"
          } >> "${GITHUB_STEP_SUMMARY}"
