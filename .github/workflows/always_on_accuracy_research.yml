name: Always-on Accuracy Research

on:
  schedule:
    # One bounded research cycle each hour, GitHub best effort.
    - cron: "17 * * * *"
  workflow_dispatch:
  # GITHUB_TOKEN-created commits do NOT trigger normal push workflows.
  # Once the registered lab has published a current-sha scientific summary,
  # run the bounded hourly researcher without waiting for its next cron.
  workflow_run:
    workflows: ["Advanced Statistical Validation Lab"]
    types: [completed]
  pull_request:
    paths:
      - "always_on_accuracy_agent.py"
      - "research_literature_pipeline.py"
      - "research_evidence_resilience.py"
      - "research_application_gate.py"
      - "research_autonomy_orchestrator.py"
      - "tests/test_research_autonomy_orchestrator.py"
      - "RESEARCH_AUTONOMY_ORCHESTRATOR.md"
      - "tests/test_research_application_gate.py"
      - "RESEARCH_APPLICATION_GATE.md"
      - "tests/test_always_on_accuracy_agent.py"
      - "tests/test_research_literature_pipeline.py"
      - "tests/test_research_evidence_resilience.py"
      - ".github/workflows/always_on_accuracy_research.yml"
      - "ALWAYS_ON_ACCURACY_RESEARCH.md"
      - "RESEARCH_LITERATURE_PIPELINE.md"
      - "RESEARCH_EVIDENCE_RESILIENCE.md"
      - "dashboard_status_snapshot.py"
      - "docs/**"
  push:
    branches: [main]
    paths:
      - "always_on_accuracy_agent.py"
      - "research_literature_pipeline.py"
      - "research_evidence_resilience.py"
      - "research_autonomy_orchestrator.py"
      - "tests/test_research_autonomy_orchestrator.py"
      - "tests/test_always_on_accuracy_agent.py"
      - "tests/test_research_literature_pipeline.py"
      - "tests/test_research_evidence_resilience.py"
      - "research_cycle_provenance_recovery.py"
      - "tests/test_research_cycle_provenance_recovery.py"
      - "loto7.csv"
      - "loto7_agent_output/source_validation.json"
      - "loto7_agent_output/research_cycle_guard.json"
      - "loto7_agent_output/advanced_validation_lab_summary.json"
      - ".github/workflows/always_on_accuracy_research.yml"
      - "ALWAYS_ON_ACCURACY_RESEARCH.md"
      - "RESEARCH_LITERATURE_PIPELINE.md"
      - "RESEARCH_EVIDENCE_RESILIENCE.md"

permissions:
  contents: write

concurrency:
  group: bounded-always-on-accuracy-main
  cancel-in-progress: false

jobs:
  bounded-research:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify safe research, DOI checking and self-recovery tests
        run: |
          python -m pip install -r requirements.txt pytest
          python -m compileall -q always_on_accuracy_agent.py research_literature_pipeline.py research_evidence_resilience.py research_application_gate.py research_autonomy_orchestrator.py
          python -m pytest -q tests/test_live_evidence_boundaries.py
          bash scripts/ci_verify_frozen_regressions.sh             tests/test_always_on_accuracy_agent.py             tests/test_research_literature_pipeline.py             tests/test_research_evidence_resilience.py             tests/test_research_application_gate.py             tests/test_research_autonomy_orchestrator.py
      - name: Isolated PR smoke test without tracked-data writes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/accuracy-research-smoke/loto7_agent_output
          # The original research review integration was registered against
          # 699-draw historical diagnostics. Exercise it on its pinned inputs
          # in /tmp, not on stale 699 analysis mixed with live 700 outcomes.
          PIN=8928cb2e3ef3496e1ad8b6c02b0c3c402beef38b
          git archive "$PIN" -- loto7.csv             loto7_agent_output/source_validation.json             loto7_agent_output/research_cycle_guard.json             loto7_agent_output/future_holdout_state.json             loto7_agent_output/joint_set_v2_signal_oos_state.json             loto7_agent_output/continuous_learning_agent_state.json             loto7_agent_output/accuracy_extension_agent_state.json             loto7_agent_output/advanced_validation_lab_summary.json             | tar -xf - -C /tmp/accuracy-research-smoke
          python always_on_accuracy_agent.py --repo-root /tmp/accuracy-research-smoke
          python research_literature_pipeline.py --repo-root /tmp/accuracy-research-smoke
          python research_evidence_resilience.py --repo-root /tmp/accuracy-research-smoke
          python research_application_gate.py --repo-root /tmp/accuracy-research-smoke
          python research_autonomy_orchestrator.py --repo-root /tmp/accuracy-research-smoke
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path("/tmp/accuracy-research-smoke/loto7_agent_output")
          journal = json.loads((out / "always_on_accuracy_research_state.json").read_text())
          paper = json.loads((out / "research_verified_publications.json").read_text())
          sandbox = json.loads((out / "research_method_sandbox.json").read_text())
          recovery = json.loads((out / "research_self_repair_report.json").read_text())
          designs = json.loads((out / "research_experiment_proposals.json").read_text())
          assert journal["sequence"] == 1 and not journal["promotion_authorized"]
          assert paper["automatic_adoption"] is False and paper["full_text_reviewed_count"] == 0
          assert sandbox["future_oos_draws_consumed"] == 0
          assert sandbox["real_model_experiments_executed"] == 0
          assert recovery["requires_human_review_for_code_or_protocol_bugs"] is True
          assert designs["executed_experiments"] == 0
          gate=json.loads((out / "research_application_readiness.json").read_text())
          assert gate["synthetic_control"]["status"]=="synthetic_controls_passed"
          assert gate["new_experiments_executed"]==0 and not gate["auto_production_release"]
          assert all(not p["experiment_approved"] for p in designs["proposals"])
          queue=json.loads((out / "research_autonomy_priority_queue.json").read_text())
          assert queue["authority"]["workflows_dispatched"] is False
          assert queue["authority"]["production_or_champion_update"] is False
          assert all(t["safe_autonomous_action"] == "report_only" for t in queue["tasks"])
          print("safe research verification:", [r["status"] for r in paper["verifications"]])
          PY
      - name: Inspect trusted source and registered science lag before research
        if: github.event_name != 'pull_request'
        id: science_provenance
        shell: bash
        run: |
          python research_cycle_provenance_recovery.py \
            --repo-root . \
            --github-output "$GITHUB_OUTPUT"
          echo "Validated research status: ${{ steps.science_provenance.outputs.status }}"
          # A stale scientific summary does NOT authorize resetting the 800/800
          # budget, rewriting an experiment, or grading unverified results.
          # Only the registered advanced lab may refresh its own summary.
      - name: Commit only research-owned generated artifacts
        if: github.event_name != 'pull_request' && steps.science_provenance.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "loto7-ai-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python always_on_accuracy_agent.py --repo-root .
            python research_literature_pipeline.py --repo-root .
            python research_evidence_resilience.py --repo-root .
            python research_application_gate.py --repo-root .
            python research_autonomy_orchestrator.py --repo-root .
            git add -- \
              loto7_agent_output/always_on_accuracy_research_journal.jsonl \
              loto7_agent_output/always_on_accuracy_research_state.json \
              loto7_agent_output/always_on_accuracy_research_report.md \
              loto7_agent_output/research_literature_reviews.json \
              loto7_agent_output/research_experiment_proposals.json \
              loto7_agent_output/research_literature_review_report.md \
              loto7_agent_output/research_verified_publications.json \
              loto7_agent_output/research_method_sandbox.json \
              loto7_agent_output/research_self_repair_report.json \
              loto7_agent_output/research_verified_method_report.md \
              loto7_agent_output/research_application_readiness.json \
              loto7_agent_output/research_application_readiness_report.md \
              loto7_agent_output/research_autonomy_priority_queue.json \
              loto7_agent_output/research_autonomy_priority_report.md
            unexpected="$(git diff --cached --name-only | grep -Ev '^loto7_agent_output/(always_on_accuracy_research_(journal.jsonl|state.json|report.md)|research_literature_reviews.json|research_experiment_proposals.json|research_literature_review_report.md|research_verified_publications.json|research_method_sandbox.json|research_self_repair_report.json|research_verified_method_report.md|research_application_readiness.json|research_application_readiness_report.md|research_autonomy_priority_queue.json|research_autonomy_priority_report.md)$' || true)"
            if [ -n "$unexpected" ]; then
              echo "::error::Unsafe staged paths: $unexpected"
              exit 1
            fi
            if git diff --cached --quiet; then
              echo "No changed research artifacts."
              exit 0
            fi
            git commit -m "chore: audit scholarly evidence and bounded research recovery"
            if git push origin HEAD:main; then
              echo "Research-only evidence published."
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Research-only record push failed after retries."
              exit 1
            fi
          done
      - name: Research and recovery report
        if: always()
        shell: bash
        run: |
          {
            echo "## Hourly research, source validation and safe recovery"
            cat loto7_agent_output/always_on_accuracy_research_report.md 2>/dev/null || \
              cat /tmp/accuracy-research-smoke/loto7_agent_output/always_on_accuracy_research_report.md 2>/dev/null || true
            cat loto7_agent_output/research_literature_review_report.md 2>/dev/null || \
              cat /tmp/accuracy-research-smoke/loto7_agent_output/research_literature_review_report.md 2>/dev/null || true
            cat loto7_agent_output/research_verified_method_report.md 2>/dev/null || \
              cat /tmp/accuracy-research-smoke/loto7_agent_output/research_verified_method_report.md 2>/dev/null || true
            cat loto7_agent_output/research_application_readiness_report.md 2>/dev/null || \
              cat /tmp/accuracy-research-smoke/loto7_agent_output/research_application_readiness_report.md 2>/dev/null || true
            cat loto7_agent_output/research_autonomy_priority_report.md 2>/dev/null || \
              cat /tmp/accuracy-research-smoke/loto7_agent_output/research_autonomy_priority_report.md 2>/dev/null || true
            echo "No unreviewed paper executes model code. No Production or registered OOS edits."
          } >> "$GITHUB_STEP_SUMMARY"
