name: Browser Ops Snapshot

on:
  pull_request:
    paths:
      - "dashboard_status_snapshot.py"
      - "dashboard_snapshot_freshness.py"
      - "tests/test_dashboard_snapshot_freshness.py"
      - "dashboard_prize_totals.py"
      - "tests/test_dashboard_prize_totals.py"
      - "dashboard_roi_cash_v2.py"
      - "production_disjoint35_policy.py"
      - "tests/test_dashboard_roi_cash_v2.py"
      - "evaluation_scorecard.py"
      - "tests/test_evaluation_scorecard.py"
      - "public_issued_prediction.py"
      - "tests/test_public_issued_prediction.py"
      - "agent_operations_planner.py"
      - "tests/test_agent_operations_planner.py"
      - "tests/test_dashboard_status_snapshot.py"
      - "docs/**"
      - ".github/workflows/dashboard_ops_snapshot.yml"
      - "tests/test_ephemeral_research_caches.py"
      - "tests/test_automation_status_recovery.py"
  push:
    branches: [main]
    paths:
      - "dashboard_status_snapshot.py"
      - "dashboard_snapshot_freshness.py"
      - "tests/test_dashboard_snapshot_freshness.py"
      - "dashboard_prize_totals.py"
      - "tests/test_dashboard_prize_totals.py"
      - "dashboard_roi_cash_v2.py"
      - "production_disjoint35_policy.py"
      - "tests/test_dashboard_roi_cash_v2.py"
      - "agent_operations_planner.py"
      - "tests/test_dashboard_status_snapshot.py"
      - "tests/test_ephemeral_research_caches.py"
      - "docs/app.js"
      - "docs/index.html"
      - "docs/style.css"
      - "docs/telemetry.mjs"
      - "docs/tests/**"
      - ".github/workflows/dashboard_ops_snapshot.yml"
      - "loto7_agent_output/**"
  schedule:
    # Half-hour snapshot cadence; no longer publish after every research job.
    - cron: "13,43 * * * *"
  # Immediate refresh only for source verification or public Production issue.
  # One independent hourly research completion is a backup heartbeat only.
  # It never rebuilds a snapshot younger than 60 minutes.
  workflow_run:
    workflows:
      - "LOTO7 Independent Result Corroboration"
      - "Weekly Production Publisher"
      - "Recursive Code and Meta Evolution"
    types: [completed]
    # Never wake privileged dashboard publishing from a PR/fork branch.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: browser-ops-snapshot-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  validate-public-status:
    # Block untrusted or failed upstream workflow_run completions.
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.event != 'pull_request'
      )
    permissions:
      contents: read
      actions: read
    outputs:
      refresh_required: ${{ steps.freshness.outputs.refresh_required }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Tokyo
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check backup heartbeat freshness
        id: freshness
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Recursive Code and Meta Evolution'
        shell: bash
        run: |
          python3 dashboard_snapshot_freshness.py --snapshot docs/data/dashboard_snapshot.json --github-output
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Setup Node
        if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          # Explicitly disable implicit npm caching in this read-only validation job.
          package-manager-cache: false
      # This step MUST run for schedule and workflow_run too. Both skip
      # the PR/push-only validation step, but still build the dashboard.
      - name: Install dashboard runtime dependencies for all triggers
        run: |
          python -m pip install -r requirements.txt
          python -c "import numpy, pandas; print('Dashboard runtime imports OK')"
      - name: Validate telemetry builder and UI
        if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install pytest
          python -m compileall -q dashboard_snapshot_freshness.py dashboard_prize_totals.py dashboard_status_snapshot.py dashboard_roi_cash_v2.py evaluation_scorecard.py agent_operations_planner.py public_issued_prediction.py
          python -m pytest -q tests/test_dashboard_snapshot_freshness.py tests/test_dashboard_prize_totals.py tests/test_dashboard_status_snapshot.py tests/test_evaluation_scorecard.py tests/test_agent_operations_planner.py tests/test_ephemeral_research_caches.py tests/test_public_issued_prediction.py tests/test_dashboard_roi_cash_v2.py tests/test_dashboard_workflow_runtime_deps.py
          node --check docs/app.js
          node --check docs/telemetry.mjs
          node --test docs/tests/*.test.mjs
      - name: Dry run (PR only)
        if: github.event_name == 'pull_request'
        run: |
          python dashboard_status_snapshot.py --repo-root . --output /tmp/dashboard_snapshot.json --fetch-workflows
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/dashboard_snapshot.json").read_text(encoding="utf-8"))
          assert r["version"]=="loto7-ops-snapshot-v1"
          assert r["prediction_metrics"]["version"]=="prediction-metrics-scorecard-v1"
          assert r["roi_cash_v2"]["version"]=="dashboard-roi-cash-v2-v1"
          assert r["roi_cash_v2"]["reference"]["roi_v2_net_yen"]==-132100
          assert r["roi_cash_v2"]["actual_personal_roi"] is None
          assert r["roi_cash_v2"]["automatic_purchase_authorized"] is False
          assert r["prediction_metrics"]["prediction_skill_confirmed"] is False
          assert len(r["series"]["portfolio"])==r["sources"]["holdout"]["trusted_draws"]
          assert len(r["series"]["v2"])==r["sources"]["signal"]["trusted_draws"]
          assert len(r["series"]["adaptive"])==r["sources"]["learning"]["trusted_draws"]
          assert len(r["workflows"])==10
          assert r["latest_prediction"]["status"] in ("published","not_published")
          if r["latest_prediction"]["status"]=="published":
            assert len(r["latest_prediction"]["tickets"])==5
            assert r["latest_prediction"]["no_future_oos_vectors"] is True
          assert r["operations_plan"]["version"]=="agent-operations-command-center-v1"
          assert all(t["autonomous_mutation_allowed"] is False for t in r["operations_plan"]["tasks"])
          print("Validated source commit "+r["source_commit"][:12])
          PY

  build-public-status:
    needs: validate-public-status
    # Never grant a write token to PR validation, nor to a failed/foreign
    # workflow_run. The read-only validation job must have succeeded.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.validate-public-status.result == 'success' &&
      needs.validate-public-status.outputs.refresh_required != 'false' &&
      (
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.event != 'pull_request'
        )
      )
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Tokyo
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install dashboard runtime dependencies for all triggers
        run: |
          python -m pip install -r requirements.txt
          python -c "import numpy, pandas; print('Dashboard runtime imports OK')"
      - name: Update only public snapshot on main
        if: github.event_name != 'pull_request'
        env:
          BACKUP_HEARTBEAT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Recursive Code and Meta Evolution' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "loto7-ai-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            if [ "$BACKUP_HEARTBEAT" = true ] && python dashboard_snapshot_freshness.py --snapshot docs/data/dashboard_snapshot.json --is-fresh; then
              echo "Snapshot refreshed by another job; backup heartbeat is a no-op."
              exit 0
            fi
            python dashboard_status_snapshot.py --repo-root . --output docs/data/dashboard_snapshot.json --fetch-workflows
            git add -- docs/data/dashboard_snapshot.json
            if git diff --cached --quiet; then
              echo "No snapshot change."
              break
            fi
            git commit -m "chore: refresh read-only operations dashboard snapshot"
            if git push origin HEAD:main; then
              echo "Public telemetry snapshot committed."
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Snapshot could not be committed after retries"
              exit 1
            fi
          done
      - name: Explain scope
        if: always()
        run: |
          {
            echo "## Browser operations monitoring"
            echo "Only docs/data/dashboard_snapshot.json may be staged or committed."
            echo "All registered prospective, Champion, source and Production files remain unchanged."
          } >> "$GITHUB_STEP_SUMMARY"

