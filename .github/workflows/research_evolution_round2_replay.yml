name: Research Evolution Round-2 Replay

# A successful research checkpoint or bibliography update triggers a fresh
# 2..N retrospective research replay. GITHUB_TOKEN pushes do not fire push
# workflows, therefore workflow_run is essential for the existing bot writers.
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Recursive Code and Meta Evolution"
      - "Open-ended Autonomous Evolution"
      - "Auto Verify All Online Research References"
      - "Always-on Accuracy Research"
    types: [completed]
    branches: [main]
  schedule:
    # Fallback when GitHub delays/skips an upstream completion event.
    - cron: "47 2,8,14,20 * * *"
  pull_request:
    paths:
      - "research_cycle_round2_replay.py"
      - "tests/test_research_cycle_round2_replay.py"
      - "RESEARCH_EVOLUTION_ROUND2_REPLAY.md"
      - ".github/workflows/research_evolution_round2_replay.yml"

permissions:
  contents: read

concurrency:
  group: research-evolution-round2-replay-main
  cancel-in-progress: false

jobs:
  validate-and-replay:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out audited repository state
        uses: actions/checkout@v4
        with:
          # workflow_run always uses the default-branch code/checkpoints.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Verify replay invariants and generated-code sandbox
        run: |
          python -m compileall -q research_cycle_round2_replay.py
          python -m pytest -q tests/test_research_cycle_round2_replay.py tests/test_recursive_self_evolution_agent.py
      - name: Replay research champion from draw 2 to the latest verified result
        run: |
          python research_cycle_round2_replay.py \
            --repo-root . \
            --out research_output/verified_research_round2_reforecast.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("research_output/verified_research_round2_reforecast.json").read_text())
          assert report["first_target_round"] == 2
          assert report["last_target_round"] == report["evaluated_rounds"] + 1
          assert [r["round"] for r in report["rounds"]] == list(
              range(2, report["last_target_round"] + 1))
          assert report["candidate"]["checkpoint_record_sha256"]
          assert report["expression_selected_with_hindsight"]
          assert not report["independent_prospective_evidence"]
          assert not report["promotion_authorized"]
          assert not report["production_or_champion_modified"]
          print("Replayed rounds:", report["evaluated_rounds"])
          print("Evolved generation:", report["candidate"]["generation"])
          print("Data SHA256:", report["data_sha256"])
          print("Historically selected: exploratory only")
          PY
          # No tracked files may be rewritten by this research replay.
          git diff --exit-code -- loto7.csv STATUS.md loto7_agent_output/ research/
      - name: Add research-only summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          r=json.loads(Path("research_output/verified_research_round2_reforecast.json").read_text())
          score=r["summary"]["evolved_101_onward"]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("## Reconstructed historical predictions (research-only)\n\n")
              f.write(f"- Targets: 2–{r['last_target_round']} ({r['evaluated_rounds']} rounds)\n")
              f.write(f"- Checkpoint generation: {r['candidate']['generation']}\n")
              f.write(f"- Historic mean marginal log-score edge: {score['mean_log_edge_vs_uniform']:+.8f}\n")
              f.write("- Selected with hindsight: **not independent evidence; no Production change**\n")
          PY
      - name: Archive every target prediction and result
        uses: actions/upload-artifact@v4
        with:
          name: verified-research-round2-reforecast
          path: research_output/verified_research_round2_reforecast.json
          retention-days: 30
