name: LOTO7 Agent Role Council

on:
  pull_request:
    paths:
      - "agent_role_council.py"
      - "tests/test_agent_role_council.py"
      - "AGENT_ROLE_COUNCIL.md"
      - ".github/workflows/agent_role_council.yml"
  push:
    branches: [main]
    paths:
      - "agent_role_council.py"
      - "tests/test_agent_role_council.py"
      - "AGENT_ROLE_COUNCIL.md"
      - ".github/workflows/agent_role_council.yml"
      - "loto7.csv"
      - "loto7_agent_output/future_holdout_state.json"
      - "loto7_agent_output/joint_set_v2_signal_oos_state.json"
      - "loto7_agent_output/research_cycle_guard.json"
      - "loto7_agent_output/pair_context_v2_validation.json"
      - "loto7_agent_output/weekly_production_prediction_state.json"
  schedule:
    # 10:45 JST daily; also run when important cross-workflow evidence changes.
    - cron: "45 1 * * *"
  workflow_run:
    workflows: ["LOTO7 Independent Result Corroboration", "Joint Set v2 Signal Future OOS", "Continuous Learning Agent Prospective", "Continuous LOTO7 Research v4", "Pair Context v2 Numeric Diagnostics"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loto7-agent-role-council
  cancel-in-progress: false

jobs:
  role-reviews:
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.event != 'pull_request'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Verify current OOS trust counts and 699 role regressions
        run: |
          python -m compileall -q agent_role_council.py tests/test_agent_role_council.py
          python -m pytest -q tests/test_live_evidence_boundaries.py
          bash scripts/ci_verify_frozen_regressions.sh tests/test_agent_role_council.py

      - name: Read-only pull request review
        if: github.event_name == 'pull_request'
        run: |
          python agent_role_council.py \
            --repo-root . \
            --out-dir /tmp/loto7-agent-role-council \
            --fail-on-blocker


      - name: Show pull request advisory evidence
        if: always() && github.event_name == 'pull_request'
        run: |
          cat /tmp/loto7-agent-role-council/agent_role_council_report.md 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true

  publish-research-only:
    needs: role-reviews
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.role-reviews.result == 'success' &&
      (
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.event != 'pull_request'
        )
      )
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Publish advisory report only
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "loto7-ai-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for ATTEMPT in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python agent_role_council.py \
              --repo-root . \
              --out-dir loto7_agent_output

            git add -- \
              loto7_agent_output/agent_role_council_summary.json \
              loto7_agent_output/agent_role_council_report.md

            unexpected="$(git diff --cached --name-only | grep -Ev '^(loto7_agent_output/agent_role_council_summary[.]json|loto7_agent_output/agent_role_council_report[.]md)
              loto7_agent_output/agent_role_council_summary.json \
              loto7_agent_output/agent_role_council_report.md)" ]; then
              echo "No role-council report change."
              break
            fi

            git commit -m "chore: refresh role council advisory report"
            if git push origin HEAD:main; then
              echo "Role-council report committed."
              break
            fi
            if [ "$ATTEMPT" -eq 5 ]; then
              echo "Could not persist role-council report" >&2
              exit 1
            fi
          done

          # Report first, then a meaningful red Actions status for a true blocker.
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("loto7_agent_output/agent_role_council_summary.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          if report["overall"] == "block":
              raise SystemExit("Role council BLOCK: investigate high-priority handoffs; no automatic freeze/promotion.")
          PY

      - name: Always display evidence and prioritized handoffs
        if: always()
        run: |
          {
            echo "## LOTO7 Agent Role Council"
            cat loto7_agent_output/agent_role_council_report.md 2>/dev/null || \
              cat /tmp/loto7-agent-role-council/agent_role_council_report.md 2>/dev/null || true
            echo
            echo "Only this advisor's two report files can be written; no Production, Champion or Future-OOS writes."
          } >> "$GITHUB_STEP_SUMMARY"
 || true)"
            if [ -n "$unexpected" ]; then
              echo "::error::Unauthorized staged paths: $unexpected"
              exit 1
            fi

            if [ -z "$(git status --porcelain -- \
              loto7_agent_output/agent_role_council_summary.json \
              loto7_agent_output/agent_role_council_report.md)" ]; then
              echo "No role-council report change."
              break
            fi

            git commit -m "chore: refresh role council advisory report"
            if git push origin HEAD:main; then
              echo "Role-council report committed."
              break
            fi
            if [ "$ATTEMPT" -eq 5 ]; then
              echo "Could not persist role-council report" >&2
              exit 1
            fi
          done

          # Report first, then a meaningful red Actions status for a true blocker.
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("loto7_agent_output/agent_role_council_summary.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          if report["overall"] == "block":
              raise SystemExit("Role council BLOCK: investigate high-priority handoffs; no automatic freeze/promotion.")
          PY

      - name: Always display evidence and prioritized handoffs
        if: always()
        run: |
          {
            echo "## LOTO7 Agent Role Council"
            cat loto7_agent_output/agent_role_council_report.md 2>/dev/null || \
              cat /tmp/loto7-agent-role-council/agent_role_council_report.md 2>/dev/null || true
            echo
            echo "Only this advisor's two report files can be written; no Production, Champion or Future-OOS writes."
          } >> "$GITHUB_STEP_SUMMARY"
