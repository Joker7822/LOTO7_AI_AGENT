name: Continuous Learning Agent Prospective

on:
  pull_request:
    paths:
      - ".github/workflows/continuous_learning_agent.yml"
      - "continuous_learning_agent.py"
      - "tests/test_continuous_learning_agent.py"
      - "CONTINUOUS_LEARNING_AGENT.md"
      - "scripts/ci_verify_frozen_regressions.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/continuous_learning_agent.yml"
      - "continuous_learning_agent.py"
      - "tests/test_continuous_learning_agent.py"
      - "CONTINUOUS_LEARNING_AGENT.md"
      - "scripts/ci_verify_frozen_regressions.sh"
      - "loto7.csv"
      - "loto7_agent_output/source_validation.json"
  schedule:
    # Daily verification/recovery at 10:35 JST.
    - cron: "35 1 * * *"
  # Evidence written by a GITHUB_TOKEN workflow does not trigger push CI.
  workflow_run:
    workflows: ["LOTO7 Independent Result Corroboration"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prospective-continuous-learning-agent
  cancel-in-progress: false

jobs:
  protected-learning-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Tokyo

    steps:
      - name: Checkout full evidence
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Verify synthetic temporal state machine and prior-only learner
        run: |
          python -m compileall -q continuous_learning_agent.py tests/test_continuous_learning_agent.py
          # These lifecycle tests intentionally begin at synthetic round 699.
          # Keep their input frozen in an ephemeral directory even after actual
          # live data advances to 700+. This never rewrites on-disk evidence.
          bash scripts/ci_verify_frozen_regressions.sh tests/test_continuous_learning_agent.py

      - name: Dry-run actual registered temporal ledger without main writes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          sandbox="$(mktemp -d)"
          mkdir -p "$sandbox/loto7_agent_output"
          cp -- loto7.csv "$sandbox/loto7.csv"
          for file in continuous_learning_agent.py predictive_expert_agent.py joint_set_v2_model.py joint_set_v2_signal_oos_guard.py joint_set_v2_signal_oos.py; do
            cp -- "$file" "$sandbox/$file"
          done
          cp -- loto7_agent_output/source_validation.json "$sandbox/loto7_agent_output/"
          for file in loto7_agent_output/continuous_learning_agent_*; do
            if [ -f "$file" ]; then
              cp -- "$file" "$sandbox/loto7_agent_output/"
            fi
          done
          python continuous_learning_agent.py \
            --repo-root "$sandbox" \
            --out-dir "$sandbox/loto7_agent_output" \
            --source-report "$sandbox/loto7_agent_output/source_validation.json"
          python - "$sandbox" <<'PY'
          import json
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1]) / "loto7_agent_output"
          state = json.loads((root / "continuous_learning_agent_state.json").read_text())
          source = json.loads((root / "source_validation.json").read_text())
          if source["verification"] == "verified_two_result_sources" and source["latest"]["round"] == 700:
              assert state["current_target_round"] == 701
              assert (root / "continuous_learning_agent_freeze_history.jsonl").is_file()
          else:
              assert state["trusted_draws"] == 0
          print("Prospective dry-run target:", state["current_target_round"])
          PY
          git diff --exit-code -- loto7.csv loto7_agent_output/

      - name: Safely update independent prospective research ledger on main
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "loto7-ai-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for ATTEMPT in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            # FAIL CLOSED on missing, modified, retrospective or out-of-order
            # evidence before any new result is graded or vector is frozen.
            python continuous_learning_agent.py \
              --repo-root . \
              --out-dir loto7_agent_output \
              --source-report loto7_agent_output/source_validation.json

            for P in \
              loto7_agent_output/continuous_learning_agent_registration.json \
              loto7_agent_output/continuous_learning_agent_registry.json \
              loto7_agent_output/continuous_learning_agent_state.json \
              loto7_agent_output/continuous_learning_agent_freeze_history.jsonl \
              loto7_agent_output/continuous_learning_agent_results.jsonl \
              loto7_agent_output/continuous_learning_agent_summary.json \
              loto7_agent_output/continuous_learning_agent_report.md; do
              if [ -f "$P" ]; then
                git add -- "$P"
              fi
            done

            if [ -z "$(git status --porcelain -- loto7_agent_output/continuous_learning_agent_*)" ]; then
              echo "No independent adaptive research changes."
              exit 0
            fi
            git commit -m "chore: append prospective continuous learning evidence"
            if git push origin HEAD:main; then
              echo "Continuous learning freeze / trusted grade persisted."
              exit 0
            fi
            echo "Main branch advanced; recomputing from latest registered evidence."
          done
          echo "Could not persist evidence after bounded retry; no backfill permitted" >&2
          exit 1

      - name: Research-only status
        if: always()
        shell: bash
        run: |
          {
            echo "## Continuous learning (research-only, prospectively frozen)"
            cat loto7_agent_output/continuous_learning_agent_report.md 2>/dev/null || \
              cat /tmp/continuous-learning-prospective-test/continuous_learning_agent_report.md 2>/dev/null || true
            echo
            echo "No automatic model selection, unregistered OOS claim or Production authority."
          } >> "$GITHUB_STEP_SUMMARY"
