name: Continuous LOTO7 Research v4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/continuous_loto7_v4.yml"
      - "loto7_v4_runner.py"
      - "research_v4_no_production.py"
      - "weekly_production_prediction.py"
      - "research_feedback.py"
      - "research_feedback_bootstrap.py"
      - "feedback_optimizer.py"
      - "separated_optimizer.py"
      - "robust_signal_optimizer.py"
      - "research_cycle_guard.py"
      - "precision_random_baseline.py"
      - "null_search_calibration.py"
      - "matched_budget_null_calibration.py"
      - "true_nested_evolution.py"
      - "formal_challenger.py"
      - "model_history_reconcile.py"
      - "historical_replay.py"
      - "historical_reconcile.py"
      - "nested_replay.py"
      - "v4_status.py"
      - "runtime_metrics.py"
      - "fetch_validate.py"
      - "audit_ledger.py"
  schedule:
    # Daily recovery/bootstrap at 02:00 JST (17:00 UTC previous day).
    - cron: "0 17 * * *"
    # Publish the frozen weekly Production prediction every Friday at 17:00 JST.
    # 08:00 UTC = 17:00 JST.
    - cron: "0 8 * * 5"
    # While WAIT_FOR_NEW_DATA, continue result checks after the Friday draw.
    # 09:00-13:00 UTC = 18:00-22:00 JST.
    - cron: "0 9-13 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: continuous-loto7-evolution
  cancel-in-progress: true

jobs:
  continuous-research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Asia/Tokyo
      CONTINUOUS_WINDOW_SECONDS: 14400
      CHECKPOINT_EVERY: 10
      MAX_CHECKPOINT_SECONDS: 900

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Verify code once per runner
        run: |
          python -m compileall -q .
          python -m pytest -q

      - name: Run continuous v4 research
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "loto7-ai-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          RUNNER_START=$(date +%s)
          LAST_FETCH=0
          LAST_CHECKPOINT=$RUNNER_START
          ITERATION=0
          EVENT_SCHEDULE=$(python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ.get("GITHUB_EVENT_PATH", ""))
          obj = json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}
          print(obj.get("schedule", ""))
          PY
          )
          WEEKLY_PRODUCTION_RUN=0
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$EVENT_SCHEDULE" = "0 8 * * 5" ]; then
            WEEKLY_PRODUCTION_RUN=1
          fi

          refresh_sources() {
            local dow hour max_attempts retry_seconds
            dow=$(TZ=Asia/Tokyo date +%u)
            hour=$(TZ=Asia/Tokyo date +%H)
            max_attempts=1
            retry_seconds=0
            if [ "$dow" = "5" ] && [ "$hour" -ge 20 ] && [ "$hour" -le 21 ]; then
              max_attempts=10
              retry_seconds=600
            fi

            python fetch_validate.py \
              --csv loto7.csv \
              --report loto7_agent_output/source_validation.json \
              --max-attempts "$max_attempts" \
              --interval-seconds "$retry_seconds" \
              --months 3

            python historical_replay.py \
              --csv loto7.csv \
              --out-dir loto7_agent_output \
              --min-train 100 \
              --pool-size 650 \
              --random-reps 32 \
              --last-n 0 \
              --if-stale

            python historical_reconcile.py \
              --predictions loto7_agent_output/historical_round_predictions.csv \
              --loto-csv loto7.csv \
              --out-dir loto7_agent_output \
              --if-stale

            python nested_replay.py \
              --csv loto7.csv \
              --out-dir loto7_agent_output \
              --min-train 100 \
              --last-n 120 \
              --pool-size 350 \
              --random-reps 32 \
              --if-stale

            LAST_FETCH=$(date +%s)
          }

          update_guard() {
            python research_cycle_guard.py \
              --csv loto7.csv \
              --out-dir loto7_agent_output \
              --research-state loto7_agent_output/v4_research_state.json \
              --feedback-state loto7_agent_output/research_feedback_state.json \
              --min-train 100 \
              --max-trials 800 \
              --max-stale-generations 300
          }

          current_mode() {
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path("loto7_agent_output/research_cycle_guard.json")
          obj = json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}
          print(obj.get("mode", "SEARCH"))
          PY
          }

          checkpoint() {
            python audit_ledger.py \
              --loto-csv loto7.csv \
              --tickets-csv loto7_agent_output/candidate_tickets.csv \
              --out-dir loto7_agent_output \
              --status-md STATUS.md

            python v4_status.py \
              --status STATUS.md \
              --state loto7_agent_output/v4_research_state.json \
              --pool loto7_agent_output/candidate_pool.json \
              --registry loto7_agent_output/shadow_registry.json \
              --oos loto7_agent_output/oos_candidate_state.json \
              --metrics loto7_agent_output/execution_metrics.csv \
              --historical loto7_agent_output/historical_replay_summary.json \
              --reconciliation loto7_agent_output/historical_reconciliation_summary.json \
              --nested loto7_agent_output/nested_replay_summary.json \
              --feedback loto7_agent_output/research_feedback_state.json \
              --formal loto7_agent_output/formal_challenger_state.json

            if [ -z "$(git status --porcelain -- loto7.csv STATUS.md loto7_agent_output)" ]; then
              LAST_CHECKPOINT=$(date +%s)
              return 0
            fi

            git add -- loto7.csv STATUS.md loto7_agent_output
            GENERATION=$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path("loto7_agent_output/v4_research_state.json")
          print(json.loads(p.read_text(encoding="utf-8")).get("generation", "unknown"))
          PY
            )
            git commit -m "chore: checkpoint v4 research generation ${GENERATION}"
            git pull --rebase
            git push
            LAST_CHECKPOINT=$(date +%s)
          }

          while true; do
            NOW=$(date +%s)
            ELAPSED=$((NOW - RUNNER_START))
            if [ "$ELAPSED" -ge "$CONTINUOUS_WINDOW_SECONDS" ]; then
              break
            fi

            if [ "$LAST_FETCH" -eq 0 ] || [ $((NOW - LAST_FETCH)) -ge 3600 ]; then
              refresh_sources
            fi

            # Production publication is isolated from Research/OOS processing and runs
            # only in the dedicated Friday 17:00 JST schedule slot.
            if [ "$WEEKLY_PRODUCTION_RUN" = "1" ]; then
              GITHUB_SHA="$(git rev-parse HEAD)" python weekly_production_prediction.py \
                --csv loto7.csv \
                --out-dir loto7_agent_output \
                --champion-file loto7_agent_output/model_champion.json \
                --research-state loto7_agent_output/v4_research_state.json \
                --min-train 100
              WEEKLY_PRODUCTION_RUN=0
              checkpoint
            fi

            update_guard
            MODE=$(current_mode)
            echo "[MODE] $MODE"

            # WAIT mode does no retrospective model selection or validation. Source
            # refresh above is sufficient; a new CSV SHA automatically reopens SEARCH.
            if [ "$MODE" = "WAIT_FOR_NEW_DATA" ]; then
              checkpoint
              break
            fi

            ITERATION=$((ITERATION + 1))
            START=$(date +%s)

            # Shared diagnostics are data-SHA cached.
            python precision_random_baseline.py \
              --csv loto7.csv \
              --out-dir loto7_agent_output \
              --min-train 100 \
              --reps 4096 \
              --if-stale

            python true_nested_evolution.py \
              --csv loto7.csv \
              --out-dir loto7_agent_output \
              --min-train 100 \
              --last-n 60 \
              --warmup-steps 60 \
              --inner-candidates 2 \
              --pool-size 180 \
              --random-reps 4096 \
              --if-stale

            if [ "$MODE" = "SEARCH" ]; then
              # Research/OOS processing must never publish or overwrite Production.
              # Weekly Production publication is owned exclusively by the Friday 17 JST publisher.
              GITHUB_SHA="$(git rev-parse HEAD)" python research_v4_no_production.py \
                --csv loto7.csv \
                --out-dir loto7_agent_output \
                --champion-file loto7_agent_output/model_champion.json \
                --research-state loto7_agent_output/v4_research_state.json \
                --candidate-pool loto7_agent_output/candidate_pool.json \
                --shadow-registry loto7_agent_output/shadow_registry.json \
                --oos-state loto7_agent_output/oos_candidate_state.json \
                --oos-results loto7_agent_output/shadow_oos_results.csv \
                --source-report loto7_agent_output/source_validation.json \
                --challengers 6

              python research_feedback_bootstrap.py \
                --evaluation loto7_agent_output/v4_research_evaluation.json \
                --champion-file loto7_agent_output/model_champion.json \
                --feedback-state loto7_agent_output/research_feedback_state.json

              python research_feedback.py \
                --csv loto7.csv \
                --out-dir loto7_agent_output \
                --research-state loto7_agent_output/v4_research_state.json \
                --evaluation loto7_agent_output/v4_research_evaluation.json \
                --champion-file loto7_agent_output/model_champion.json \
                --feedback-state loto7_agent_output/research_feedback_state.json \
                --min-train 100 \
                --pool-size 350 \
                --random-reps 8

              python robust_signal_optimizer.py \
                --csv loto7.csv \
                --out-dir loto7_agent_output \
                --feedback-state loto7_agent_output/research_feedback_state.json \
                --research-state loto7_agent_output/v4_research_state.json \
                --guard loto7_agent_output/research_cycle_guard.json \
                --min-train 100 \
                --pool-size 350 \
                --random-reps 4096 \
                --trials 2

              python model_history_reconcile.py \
                --csv loto7.csv \
                --out-dir loto7_agent_output \
                --feedback-state loto7_agent_output/research_feedback_state.json \
                --research-state loto7_agent_output/v4_research_state.json \
                --min-train 100 \
                --pool-size 350 \
                --if-stale
            else
              # VALIDATION_ONLY: freeze the accepted parent and calibrate it against
              # synthetic 7/37 histories using exactly this data SHA's real Signal
              # trial budget plus the same Signal gate, era gate, and plateau rule.
              python matched_budget_null_calibration.py \
                --csv loto7.csv \
                --out-dir loto7_agent_output \
                --feedback-state loto7_agent_output/research_feedback_state.json \
                --guard loto7_agent_output/research_cycle_guard.json \
                --min-train 100 \
                --target-worlds 64 \
                --worlds-per-run 1

              # Re-evaluate the guard immediately. The 64th matched world transitions
              # VALIDATION_ONLY -> WAIT_FOR_NEW_DATA without another research cycle.
              update_guard
              MODE=$(current_mode)
            fi

            END=$(date +%s)
            DURATION=$((END - START))

            python runtime_metrics.py \
              --iteration "$ITERATION" \
              --duration-seconds "$DURATION" \
              --state loto7_agent_output/v4_research_state.json \
              --metrics loto7_agent_output/execution_metrics.csv

            if [ "$MODE" = "VALIDATION_ONLY" ] || [ "$MODE" = "WAIT_FOR_NEW_DATA" ]; then
              # Matched worlds are expensive; persist every completed world so a runner
              # cancellation never loses validation progress.
              checkpoint
            else
              FORCE=$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path("loto7_agent_output/run_events.json")
          obj = json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}
          print("1" if obj.get("force_checkpoint") else "0")
          PY
              )
              NOW=$(date +%s)
              if [ "$FORCE" = "1" ] || [ $((ITERATION % CHECKPOINT_EVERY)) -eq 0 ] || [ $((NOW - LAST_CHECKPOINT)) -ge "$MAX_CHECKPOINT_SECONDS" ]; then
                checkpoint
              fi
            fi

            if [ "$MODE" = "WAIT_FOR_NEW_DATA" ]; then
              break
            fi
          done

          checkpoint

      - name: Show latest state
        if: success()
        shell: bash
        run: |
          {
            cat STATUS.md
            echo
            echo '## Research cycle guard'
            if [ -f loto7_agent_output/research_cycle_guard.json ]; then
              cat loto7_agent_output/research_cycle_guard.json
            fi
            echo
            echo '## Weekly Production publisher'
            if [ -f loto7_agent_output/weekly_production_prediction_state.json ]; then
              cat loto7_agent_output/weekly_production_prediction_state.json
            fi
            echo
            echo '## Era Signal robustness'
            if [ -f loto7_agent_output/era_signal_robustness_report.md ]; then
              cat loto7_agent_output/era_signal_robustness_report.md
            fi
            echo
            echo '## High-precision Random baseline'
            if [ -f loto7_agent_output/precision_random_baseline_report.md ]; then
              cat loto7_agent_output/precision_random_baseline_report.md
            fi
            echo
            echo '## Robust Signal optimizer'
            if [ -f loto7_agent_output/robust_signal_optimizer_report.md ]; then
              cat loto7_agent_output/robust_signal_optimizer_report.md
            fi
            echo
            echo '## True Nested Evolution'
            if [ -f loto7_agent_output/true_nested_evolution_report.md ]; then
              cat loto7_agent_output/true_nested_evolution_report.md
            fi
            echo
            echo '## Legacy bounded Null calibration'
            if [ -f loto7_agent_output/null_search_calibration_report.md ]; then
              cat loto7_agent_output/null_search_calibration_report.md
            fi
            echo
            echo '## Matched-Budget Null calibration'
            if [ -f loto7_agent_output/matched_budget_null_calibration_report.md ]; then
              cat loto7_agent_output/matched_budget_null_calibration_report.md
            else
              echo 'Matched-Budget Null calibration has not started yet.'
            fi
            echo
            echo '## Latest accepted model historical reconciliation'
            if [ -f loto7_agent_output/latest_model_historical_reconciliation.txt ]; then
              sed -n '1,35p' loto7_agent_output/latest_model_historical_reconciliation.txt
            fi
            echo
            echo '## Formal Challenger state'
            if [ -f loto7_agent_output/formal_challenger_state.json ]; then
              cat loto7_agent_output/formal_challenger_state.json
            fi
            echo
            echo '## Production prediction'
            echo '```text'
            cat loto7_agent_output/latest_prediction.txt
            echo '```'
            echo
            echo '## Latest research prediction'
            echo '```text'
            cat loto7_agent_output/latest_research_prediction.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch successor runner
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          MODE=$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path("loto7_agent_output/research_cycle_guard.json")
          obj = json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}
          print(obj.get("mode", "SEARCH"))
          PY
          )
          if [ "$MODE" = "WAIT_FOR_NEW_DATA" ]; then
            echo "WAIT_FOR_NEW_DATA: successor dispatch suppressed. Scheduled source checks remain active."
            exit 0
          fi
          gh workflow run continuous_loto7_v4.yml --repo "$GITHUB_REPOSITORY" --ref main
