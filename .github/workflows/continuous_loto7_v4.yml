name: Continuous LOTO7 Research v4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/continuous_loto7_v4.yml"
      - "loto7_v4_runner.py"
      - "research_feedback.py"
      - "research_feedback_bootstrap.py"
      - "feedback_optimizer.py"
      - "historical_replay.py"
      - "historical_reconcile.py"
      - "nested_replay.py"
      - "v4_status.py"
      - "runtime_metrics.py"
      - "fetch_validate.py"
      - "audit_ledger.py"
  schedule:
    # Daily recovery/bootstrap at 02:00 JST (17:00 UTC previous day).
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: continuous-loto7-evolution
  cancel-in-progress: true

jobs:
  continuous-research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Asia/Tokyo
      CONTINUOUS_WINDOW_SECONDS: 14400
      CHECKPOINT_EVERY: 10
      MAX_CHECKPOINT_SECONDS: 900

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Verify code once per runner
        run: |
          python -m compileall -q .
          python -m pytest -q

      - name: Run continuous v4 research
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "loto7-ai-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          RUNNER_START=$(date +%s)
          LAST_FETCH=0
          LAST_CHECKPOINT=$RUNNER_START
          ITERATION=0

          refresh_sources() {
            local dow hour max_attempts retry_seconds
            dow=$(TZ=Asia/Tokyo date +%u)
            hour=$(TZ=Asia/Tokyo date +%H)
            max_attempts=1
            retry_seconds=0
            if [ "$dow" = "5" ] && [ "$hour" -ge 20 ] && [ "$hour" -le 21 ]; then
              max_attempts=10
              retry_seconds=600
            fi
            python fetch_validate.py \
              --csv loto7.csv \
              --report loto7_agent_output/source_validation.json \
              --max-attempts "$max_attempts" \
              --interval-seconds "$retry_seconds" \
              --months 3

            python historical_replay.py \
              --csv loto7.csv \
              --out-dir loto7_agent_output \
              --min-train 100 \
              --pool-size 650 \
              --random-reps 32 \
              --last-n 0 \
              --if-stale

            python historical_reconcile.py \
              --predictions loto7_agent_output/historical_round_predictions.csv \
              --loto-csv loto7.csv \
              --out-dir loto7_agent_output \
              --if-stale

            python nested_replay.py \
              --csv loto7.csv \
              --out-dir loto7_agent_output \
              --min-train 100 \
              --last-n 120 \
              --pool-size 350 \
              --random-reps 32 \
              --if-stale
            LAST_FETCH=$(date +%s)
          }

          checkpoint() {
            python audit_ledger.py \
              --loto-csv loto7.csv \
              --tickets-csv loto7_agent_output/candidate_tickets.csv \
              --out-dir loto7_agent_output \
              --status-md STATUS.md

            python v4_status.py \
              --status STATUS.md \
              --state loto7_agent_output/v4_research_state.json \
              --pool loto7_agent_output/candidate_pool.json \
              --registry loto7_agent_output/shadow_registry.json \
              --oos loto7_agent_output/oos_candidate_state.json \
              --metrics loto7_agent_output/execution_metrics.csv \
              --historical loto7_agent_output/historical_replay_summary.json \
              --reconciliation loto7_agent_output/historical_reconciliation_summary.json \
              --nested loto7_agent_output/nested_replay_summary.json

            if [ -z "$(git status --porcelain -- loto7.csv STATUS.md loto7_agent_output)" ]; then
              LAST_CHECKPOINT=$(date +%s)
              return 0
            fi

            git add -- loto7.csv STATUS.md loto7_agent_output
            GENERATION=$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path("loto7_agent_output/v4_research_state.json")
          print(json.loads(p.read_text(encoding="utf-8")).get("generation", "unknown"))
          PY
            )
            git commit -m "chore: checkpoint v4 research generation ${GENERATION}"
            git pull --rebase
            git push
            LAST_CHECKPOINT=$(date +%s)
          }

          while true; do
            NOW=$(date +%s)
            ELAPSED=$((NOW - RUNNER_START))
            if [ "$ELAPSED" -ge "$CONTINUOUS_WINDOW_SECONDS" ]; then
              break
            fi

            if [ "$LAST_FETCH" -eq 0 ] || [ $((NOW - LAST_FETCH)) -ge 3600 ]; then
              refresh_sources
            fi

            ITERATION=$((ITERATION + 1))
            START=$(date +%s)
            GITHUB_SHA="$(git rev-parse HEAD)" python loto7_v4_runner.py \
              --csv loto7.csv \
              --out-dir loto7_agent_output \
              --champion-file loto7_agent_output/model_champion.json \
              --research-state loto7_agent_output/v4_research_state.json \
              --candidate-pool loto7_agent_output/candidate_pool.json \
              --shadow-registry loto7_agent_output/shadow_registry.json \
              --oos-state loto7_agent_output/oos_candidate_state.json \
              --oos-results loto7_agent_output/shadow_oos_results.csv \
              --source-report loto7_agent_output/source_validation.json \
              --challengers 6

            # One-time bootstrap plus the expanded full-history optimizer. The
            # optimizer is research-only and never contributes to Production promotion.
            python research_feedback_bootstrap.py \
              --evaluation loto7_agent_output/v4_research_evaluation.json \
              --champion-file loto7_agent_output/model_champion.json \
              --feedback-state loto7_agent_output/research_feedback_state.json

            # Whenever the provisional Research Winner changes (or data changes),
            # replay that model over every eligible historical draw. Only a replay-
            # validated model is kept as research_parent_config for the next generation.
            python research_feedback.py \
              --csv loto7.csv \
              --out-dir loto7_agent_output \
              --research-state loto7_agent_output/v4_research_state.json \
              --evaluation loto7_agent_output/v4_research_evaluation.json \
              --champion-file loto7_agent_output/model_champion.json \
              --feedback-state loto7_agent_output/research_feedback_state.json \
              --min-train 100 \
              --pool-size 350 \
              --random-reps 8

            END=$(date +%s)
            DURATION=$((END - START))

            python runtime_metrics.py \
              --iteration "$ITERATION" \
              --duration-seconds "$DURATION" \
              --state loto7_agent_output/v4_research_state.json \
              --metrics loto7_agent_output/execution_metrics.csv

            FORCE=$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path("loto7_agent_output/run_events.json")
          obj = json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}
          print("1" if obj.get("force_checkpoint") else "0")
          PY
            )
            NOW=$(date +%s)
            if [ "$FORCE" = "1" ] || [ $((ITERATION % CHECKPOINT_EVERY)) -eq 0 ] || [ $((NOW - LAST_CHECKPOINT)) -ge "$MAX_CHECKPOINT_SECONDS" ]; then
              checkpoint
            fi
          done

          checkpoint

      - name: Show latest state
        if: success()
        shell: bash
        run: |
          {
            cat STATUS.md
            echo
            echo '## Historical replay accuracy'
            cat loto7_agent_output/historical_accuracy_report.md
            echo
            echo '## Historical prediction reconciliation'
            cat loto7_agent_output/historical_reconciliation_report.md
            echo
            echo '## Nested Champion / Research / Random comparison'
            cat loto7_agent_output/nested_replay_report.md
            echo
            echo '## Latest Research Winner full-history feedback'
            if [ -f loto7_agent_output/research_feedback_report.md ]; then
              cat loto7_agent_output/research_feedback_report.md
            else
              echo 'Research feedback has not been generated yet.'
            fi
            echo
            echo '## Expanded full-history feedback optimizer'
            if [ -f loto7_agent_output/feedback_optimizer_report.md ]; then
              cat loto7_agent_output/feedback_optimizer_report.md
            else
              echo 'Feedback optimizer has not been generated yet.'
            fi
            echo
            echo '## Production prediction'
            echo '```text'
            cat loto7_agent_output/latest_prediction.txt
            echo '```'
            echo
            echo '## Latest research prediction'
            echo '```text'
            cat loto7_agent_output/latest_research_prediction.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch successor runner
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run continuous_loto7_v4.yml --repo "$GITHUB_REPOSITORY" --ref main
