name: Research AI Ranked35 Historical Replay Round 2+

on:
  pull_request:
    branches: [main]
    paths:
      - "research/ranked35_walkforward_round2.py"
      - "tests/test_ranked35_walkforward_round2.py"
      - ".github/workflows/research_ranked35_replay_round2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-ranked35-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research-only-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout without publisher privileges
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Verify replay unit tests and nonanticipation
        run: |
          python -m compileall -q research/ranked35_walkforward_round2.py
          python -m pytest -q tests/test_ranked35_walkforward_round2.py

      - name: Strictly chronological round 2+ complete replay
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python research/ranked35_walkforward_round2.py \
            --csv loto7.csv \
            --champion loto7_agent_output/model_champion.json \
            --out-dir "${RUNNER_TEMP}/ranked35_replay" \
            --min-train 100 \
            --matched-reps 32

      - name: Verify full draw coverage and publish independent summary
        env:
          REPORT_DIR: ${{ runner.temp }}/ranked35_replay
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path(os.environ["REPORT_DIR"])
          result = json.loads((p / "summary.json").read_text(encoding="utf-8"))
          n = result["source_rows"]
          assert result["target_round_first"] == 2
          assert result["target_round_last"] == n
          assert result["results"]["all_rounds_2_plus"]["round_count"] == n-1
          assert result["results"]["approved_champion_101_plus"]["round_count"] == n-100
          assert result["results"]["all_rounds_2_plus"]["ticket_count"] == 5*(n-1)
          assert result["champion_parity_verified"] is True
          assert result["issued_predictions_changed"] is False
          assert result["future_oos_evidence_changed"] is False
          print(f"VERIFIED: {n-1} historical rounds and {5*(n-1)} research tickets")
          PY
          cat "${REPORT_DIR}/REPORT.md" >> "${GITHUB_STEP_SUMMARY}"
          cat "${REPORT_DIR}/REPORT.md"

      - name: Upload full per-round and per-ticket replay (read-only)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ranked35-walkforward-from-round2
          path: ${{ runner.temp }}/ranked35_replay
          retention-days: 90
          if-no-files-found: error
