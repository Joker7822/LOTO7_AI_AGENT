name: Strict OOS Bootstrap

on:
  push:
    branches: [main]
    paths:
      - "strict_oos_governance.py"
      - "strict_oos_migration.py"
      - "strict_oos_bootstrap.py"
      - "matched_permutation_oos.py"
      - "matched_permutation_ensemble.py"
      - "matched_ensemble_status.py"
      - "v4_status.py"
      - ".github/workflows/strict_oos_bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strict-oos-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Verify
        run: |
          python -m compileall -q .
          python -m pytest -q

      - name: Persist strict Future-OOS boundary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "loto7-ai-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          refresh_status() {
            python - <<'PY'
          from pathlib import Path
          p = Path("STATUS.md")
          if p.exists():
              text = p.read_text(encoding="utf-8")
              base = text.split("\n## Continuous Research v4", 1)[0].rstrip()
              p.write_text(base + "\n", encoding="utf-8")
          PY
            python v4_status.py \
              --status STATUS.md \
              --state loto7_agent_output/v4_research_state.json \
              --pool loto7_agent_output/candidate_pool.json \
              --registry loto7_agent_output/shadow_registry.json \
              --oos loto7_agent_output/oos_candidate_state.json \
              --metrics loto7_agent_output/execution_metrics.csv \
              --historical loto7_agent_output/historical_replay_summary.json \
              --reconciliation loto7_agent_output/historical_reconciliation_summary.json \
              --nested loto7_agent_output/nested_replay_summary.json \
              --feedback loto7_agent_output/research_feedback_state.json \
              --formal loto7_agent_output/formal_challenger_state.json \
              --holdout-state loto7_agent_output/future_holdout_state.json \
              --holdout-registry loto7_agent_output/future_holdout_registry.json
            python matched_ensemble_status.py \
              --status STATUS.md \
              --registry loto7_agent_output/shadow_registry.json \
              --oos loto7_agent_output/oos_candidate_state.json \
              --formal loto7_agent_output/formal_challenger_state.json \
              --holdout-state loto7_agent_output/future_holdout_state.json \
              --holdout-registry loto7_agent_output/future_holdout_registry.json
          }

          for ATTEMPT in 1 2 3; do
            echo "[STRICT-OOS] persist attempt ${ATTEMPT}/3"
            git fetch origin main
            git reset --hard origin/main

            python strict_oos_bootstrap.py \
              --csv loto7.csv \
              --out-dir loto7_agent_output \
              --shadow-registry loto7_agent_output/shadow_registry.json \
              --min-train 100 \
              --portfolio-backtest-pool 650
            refresh_status

            git add -- \
              STATUS.md \
              loto7_agent_output/shadow_registry.json \
              loto7_agent_output/formal_challenger_state.json \
              loto7_agent_output/oos_candidate_state.json \
              loto7_agent_output/future_holdout_registry.json \
              loto7_agent_output/future_holdout_state.json \
              loto7_agent_output/strict_oos_bootstrap_state.json

            if [ -z "$(git status --porcelain -- STATUS.md loto7_agent_output/shadow_registry.json loto7_agent_output/formal_challenger_state.json loto7_agent_output/oos_candidate_state.json loto7_agent_output/future_holdout_registry.json loto7_agent_output/future_holdout_state.json loto7_agent_output/strict_oos_bootstrap_state.json)" ]; then
              echo "No strict OOS bootstrap changes."
              exit 0
            fi

            git commit -m "chore: freeze strict OOS references"
            if git push origin HEAD:main; then
              echo "[STRICT-OOS] persisted successfully"
              exit 0
            fi
            echo "[STRICT-OOS] main moved during push; retrying from latest origin/main"
          done

          echo "Strict OOS state could not be persisted after 3 race-safe attempts." >&2
          exit 1

      - name: Show strict OOS state
        if: always()
        shell: bash
        run: |
          {
            echo '## Strict OOS bootstrap'
            cat loto7_agent_output/strict_oos_bootstrap_state.json 2>/dev/null || true
            echo
            echo '## Fixed prospective holdout'
            cat loto7_agent_output/future_holdout_state.json 2>/dev/null || true
            echo
            echo '## STATUS'
            cat STATUS.md
          } >> "$GITHUB_STEP_SUMMARY"
