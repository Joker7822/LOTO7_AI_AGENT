name: Historical Reforecast From Round 2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "full_round2_reforecast.py"
      - "tests/test_full_round2_reforecast.py"
      - "FULL_ROUND2_REFORECAST.md"
      - ".github/workflows/full_round2_reforecast.yml"

permissions:
  contents: read

jobs:
  research-only-reforecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scientific dependencies
        run: |
          python -m pip install -r requirements.txt pytest
      - name: Test strict chronology, frozen predictions and read-only governance
        run: |
          python -m compileall -q full_round2_reforecast.py
          python -m pytest -q tests/test_full_round2_reforecast.py tests/test_signal_portfolio_factorial.py
      - name: Reforecast every actual draw from round 2
        run: |
          python full_round2_reforecast.py \
            --csv loto7.csv \
            --out research_output/full_round2_reforecast.json \
            --scenarios 96 --candidates 32 --random-reps 8 \
            --seed 20261025
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("research_output/full_round2_reforecast.json").read_text())
          assert report["first_target_round"] == 2
          assert report["last_target_round"] == report["history_draws"]
          assert report["evaluated_rounds"] == report["history_draws"] - 1
          assert report["cold_start_rounds"] == 19
          assert [r["round"] for r in report["rounds"]] == list(
              range(2, report["history_draws"] + 1))
          assert not report["target_outcome_used_before_prediction"]
          assert not report["production_changed"]
          assert not report["future_oos_changed"]
          assert not report["independent_evidence"]
          assert not report["promotion_authorized"]
          PY
          git diff --exit-code -- loto7.csv STATUS.md loto7_agent_output/
      - name: Archive full per-draw reconstructed forecast and evaluation
        uses: actions/upload-artifact@v4
        with:
          name: full-round2-chronological-reforecast
          path: research_output/full_round2_reforecast.json
          retention-days: 30
