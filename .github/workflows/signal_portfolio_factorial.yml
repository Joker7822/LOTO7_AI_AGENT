name: Signal-Portfolio Research Diagnostics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "signal_portfolio_factorial.py"
      - "tests/test_signal_portfolio_factorial.py"
      - "SIGNAL_PORTFOLIO_FACTORIAL.md"
      - ".github/workflows/signal_portfolio_factorial.yml"

permissions:
  contents: read

jobs:
  research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install required scientific packages
        run: |
          python -m pip install -r requirements.txt pytest
      - name: Verify read-only, reproducible, prior-only evaluation
        run: |
          python -m compileall -q signal_portfolio_factorial.py
          python -m pytest -q tests/test_signal_portfolio_factorial.py
      - name: Replay all 600 historic predictions with four arms and ablations
        run: |
          python signal_portfolio_factorial.py \
            --csv loto7.csv \
            --out research_output/signal_portfolio_factorial.json \
            --min-train 100 --last-n 600 \
            --scenarios 128 --candidates 48 --random-reps 16 \
            --seed 20261025
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("research_output/signal_portfolio_factorial.json")
          result = json.loads(p.read_text(encoding="utf-8"))
          assert result["scope"] == "research_only_historical_reused_data"
          assert result["chronological_prior_only"]
          assert result["evaluated_rounds"] == 600
          assert (result["first_round_index"], result["last_round_index"]) == (101, 700)
          assert len(result["rounds"]) == 600
          assert set(result["arms"]) == {
              "uniform_random", "model_random",
              "uniform_optimized", "model_optimized",
          }
          assert not result["independent_evidence"]
          assert not result["production_changed"]
          assert not result["future_oos_changed"]
          assert not result["promotion_authorized"]
          PY
          git diff --exit-code -- loto7.csv loto7_agent_output/ STATUS.md
      - name: Upload research diagnostic only
        uses: actions/upload-artifact@v4
        with:
          name: signal-portfolio-factorial-600-draw-replay
          path: research_output/signal_portfolio_factorial.json
          retention-days: 14
