name: Autonomous Full-Text Paper Method Lab

on:
  workflow_dispatch:
  schedule:
    - cron: "31 17 * * *"
  pull_request:
    paths:
      - "paper_method_autonomy.py"
      - "paper_method_future_shadow.py"
      - "research_paper_adopted_predict.py"
      - "tests/test_paper_method_autonomy.py"
      - "tests/test_paper_method_adopted_predict.py"
      - "tests/test_paper_fulltext_end_to_end.py"
      - "PAPER_AUTONOMOUS_IMPLEMENTATION.md"
      - ".github/workflows/autonomous_fulltext_paper_lab.yml"

permissions:
  contents: read

concurrency:
  group: autonomous-fulltext-paper-lab-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded-paper research dependencies
        run: python -m pip install -r requirements.txt pytest pypdf
      - name: Verify sandbox, reproducibility, and future-adoption gate
        run: |
          python -m compileall -q paper_method_autonomy.py paper_method_future_shadow.py research_paper_adopted_predict.py
          python -m pytest -q tests/test_paper_method_autonomy.py tests/test_paper_method_adopted_predict.py tests/test_paper_fulltext_end_to_end.py tests/test_research_cycle_round2_replay.py
      - name: No tracked research or production files modified by tests
        run: git diff --exit-code -- loto7.csv loto7_agent_output/ research/

  autonomous-research:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install paper-extraction and mathematical safety dependencies
        run: python -m pip install -r requirements.txt pypdf
      - name: Run full text research and prospective candidate adoption
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PAPER_LLM_MODEL: gpt-4o-mini
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "loto7-ai-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python paper_method_autonomy.py --repo-root .
            if [ -f research/autonomous_paper_methods/candidate.json ]; then
              python paper_method_future_shadow.py --repo-root .
              python research_paper_adopted_predict.py --repo-root .
            fi
            git diff --exit-code -- loto7.csv STATUS.md loto7_agent_output/ research/disjoint_future_oos/ research/first_prize_prospective/ weekly_production_prediction.py
            git add -A -- research/autonomous_paper_methods/
            unexpected="$(git diff --cached --name-only | grep -Ev '^research/autonomous_paper_methods/(candidate|future_state|adopted_model_preview)[.]json$' || true)"
            if [ -n "$unexpected" ]; then
              echo "::error::Unauthorized paper research mutation: $unexpected"
              exit 1
            fi
            if git diff --cached --quiet; then
              echo "No new paper or prospective audit transition."
              exit 0
            fi
            git commit -m "research: audit and advance bounded full-text paper study"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "::error::Could not publish study audit after three retries"
          exit 1
