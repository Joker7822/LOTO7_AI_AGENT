name: Start Continuous LOTO7 Now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/start_continuous_now.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch-continuous-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch continuous LOTO7 workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run weekly_loto7.yml --repo Joker7822/LOTO7_AI_AGENT --ref main
