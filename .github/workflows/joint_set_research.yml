name: Joint Set Research Suite

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/joint_set_research.yml"
      - "joint_set_model.py"
      - "joint_set_research.py"
      - "joint_set_null_calibration.py"
      - "research_metadata.py"
      - "tests/test_joint_set_research.py"
  schedule:
    # Daily Research-only continuation at 03:20 JST (18:20 UTC previous day).
    - cron: "20 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: joint-set-research-suite
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Asia/Tokyo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Verify Joint Set suite
        run: |
          python -m compileall -q joint_set_model.py joint_set_research.py joint_set_null_calibration.py research_metadata.py
          python -m pytest -q tests/test_joint_set_research.py

      - name: Validate pre-draw metadata policy
        run: |
          python research_metadata.py \
            --metadata loto7_agent_output/research_external_metadata.csv \
            --report loto7_agent_output/research_metadata_summary.json \
            --cutoff-hour-jst 18

      - name: Run strict Joint Set True Nested
        run: |
          python joint_set_research.py \
            --csv loto7.csv \
            --out-dir loto7_agent_output \
            --metadata loto7_agent_output/research_external_metadata.csv \
            --min-train 100 \
            --last-n 60 \
            --selection-window 120 \
            --validation-scenarios 256 \
            --validation-candidates 64 \
            --current-scenarios 2048 \
            --current-candidates 128 \
            --random-reps 4096 \
            --cutoff-hour-jst 18 \
            --if-stale

      - name: Advance matched-budget Joint Null
        run: |
          python joint_set_null_calibration.py \
            --csv loto7.csv \
            --out-dir loto7_agent_output \
            --metadata loto7_agent_output/research_external_metadata.csv \
            --min-train 100 \
            --last-n 60 \
            --selection-window 120 \
            --validation-scenarios 256 \
            --validation-candidates 64 \
            --random-reps 4096 \
            --target-worlds 64 \
            --worlds-per-run 2 \
            --cutoff-hour-jst 18

      - name: Commit Research-only outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "loto7-ai-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            loto7_agent_output/research_external_metadata.csv \
            loto7_agent_output/research_metadata_summary.json \
            loto7_agent_output/joint_set_true_nested_summary.json \
            loto7_agent_output/joint_set_true_nested.csv \
            loto7_agent_output/joint_set_true_nested_report.md \
            loto7_agent_output/joint_set_current_research.json \
            loto7_agent_output/joint_set_candidate_tickets.csv \
            loto7_agent_output/joint_set_latest_prediction.txt \
            loto7_agent_output/joint_set_null_calibration_state.json \
            loto7_agent_output/joint_set_null_calibration_summary.json \
            loto7_agent_output/joint_set_null_calibration_report.md
          if [ -n "$(git status --porcelain -- loto7_agent_output)" ]; then
            git commit -m "chore: checkpoint Joint Set research"
            git pull --rebase
            git push
          fi

      - name: Show Joint Set state
        if: success()
        shell: bash
        run: |
          {
            echo '## Joint Set True Nested'
            cat loto7_agent_output/joint_set_true_nested_report.md
            echo
            echo '## Joint Set Matched-Budget Null'
            cat loto7_agent_output/joint_set_null_calibration_report.md
            echo
            echo '## Current Joint Set Research prediction'
            echo '```text'
            cat loto7_agent_output/joint_set_latest_prediction.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
