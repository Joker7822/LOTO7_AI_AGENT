name: Temporary Local Audit Source Bundle
on:
  push:
    branches:
      - improve/evaluation-scorecard-dashboard-cadence-20261101
    paths:
      - .github/workflows/temporary_local_audit_bundle.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create source-only snapshots (no Git history or credentials)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit_snapshot
          git archive --format=tar HEAD | gzip -6 > audit_snapshot/source_current.tar.gz
          PIN=8928cb2e3ef3496e1ad8b6c02b0c3c402beef38b
          git archive --format=tar "$PIN" loto7.csv loto7_agent_output | gzip -6 > audit_snapshot/evidence_699.tar.gz
          sha256sum audit_snapshot/*.tar.gz > audit_snapshot/checksums.txt
          ls -lh audit_snapshot
      - uses: actions/upload-artifact@v4
        with:
          name: local-audit-sources-${{ github.sha }}
          path: audit_snapshot/
          retention-days: 1
          if-no-files-found: error
