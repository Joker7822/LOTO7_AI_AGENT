name: Production Geometry35 Policy Safety

on:
  pull_request:
    paths:
      - "production_ticket_geometry35.py"
      - "weekly_production_prediction.py"
      - "tests/test_production_ticket_geometry35.py"
      - "tests/test_round701_disjoint35_supplement.py"
      - "research/round701_disjoint35_supplement.json"
      - "ROUND701_DISJOINT35_SUPPLEMENT.md"
      - ".github/workflows/production_geometry35_policy.yml"
      - ".github/workflows/weekly_production_publisher.yml"
      - ".github/workflows/weekly_production_fallback.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-production-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - name: Test 702+ Production geometry and independent 701 supplement without ledger rewrite
        run: |
          python -m compileall -q \
            production_ticket_geometry35.py weekly_production_prediction.py
          python -m pytest -q \
            tests/test_production_ticket_geometry35.py \
            tests/test_round701_disjoint35_supplement.py \
            tests/test_audit_ledger.py
          python - <<'PY'
          import production_ticket_geometry35 as p
          import balanced_uniform_portfolio as g
          assert p.MIN_TARGET_ROUND == 702
          tickets = p.portfolio_for_target(702)
          g.validate_portfolio(tickets)
          assert len({n for ticket in tickets for n in ticket}) == 35
          PY
          git diff --exit-code -- loto7.csv STATUS.md loto7_agent_output/ research/disjoint_future_oos/
