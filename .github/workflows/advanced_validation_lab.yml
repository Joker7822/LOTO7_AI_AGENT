name: Advanced Statistical Validation Lab

on:
  pull_request:
    paths:
      - "advanced_validation_lab.py"
      - "tests/test_advanced_validation_lab.py"
      - "ADVANCED_VALIDATION_LAB.md"
      - "research_cycle_provenance_recovery.py"
      - "tests/test_research_cycle_provenance_recovery.py"
      - ".github/workflows/advanced_validation_lab.yml"
  push:
    branches: [main]
    paths:
      - "advanced_validation_lab.py"
      - "tests/test_advanced_validation_lab.py"
      - "ADVANCED_VALIDATION_LAB.md"
      - "research_cycle_provenance_recovery.py"
      - "tests/test_research_cycle_provenance_recovery.py"
      - ".github/workflows/advanced_validation_lab.yml"
      - "loto7.csv"
      - "loto7_agent_output/accuracy_extension_agent_registration.json"
      - "loto7_agent_output/accuracy_extension_agent_grades.jsonl"
      - "loto7_agent_output/accuracy_extension_agent_state.json"
      - "loto7_agent_output/source_validation.json"
  schedule:
    # Recover scientific evidence within a few hours of a newly trusted CSV.
    # Same-SHA historical calculations are cached by advanced_validation_lab.py.
    # GitHub Actions cron is best-effort, not a timing guarantee.
    - cron: "37 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: advanced-statistical-validation-lab-main
  cancel-in-progress: false

jobs:
  scientific-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Tokyo
    steps:
      - name: Checkout audited repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencies
        run: |
          python -m pip install -r requirements.txt pytest
      - name: Tests for fair conditional null, code locking and no-leakage
        run: |
          python -m compileall -q advanced_validation_lab.py tests/test_advanced_validation_lab.py
          python -m pytest -q tests/test_advanced_validation_lab.py tests/test_research_cycle_provenance_recovery.py
      - name: PR audit with identical 32-world null (no tracked writes)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/advanced-validation-lab
          for name in \
            accuracy_extension_agent_registration.json \
            accuracy_extension_agent_registry.json \
            accuracy_extension_agent_state.json \
            accuracy_extension_agent_freezes.jsonl \
            accuracy_extension_agent_grades.jsonl \
            accuracy_extension_agent_summary.json \
            advanced_validation_lab_registration.json; do
            if [ -f "loto7_agent_output/$name" ]; then
              cp "loto7_agent_output/$name" /tmp/advanced-validation-lab/
            fi
          done
          # If the original target was not prospectively frozen, enforce
          # fail-closed behavior instead of fabricating a future e-process.
          if python - <<'PY'
          from pathlib import Path
          import accuracy_extension_agent as candidate
          import continuous_learning_agent as ledger
          _, _, latest = ledger.validated_draws(Path("loto7.csv"))
          raise SystemExit(
              0 if latest >= candidate.START_TARGET
              and not (Path("loto7_agent_output") / candidate.FREEZES).exists()
              else 1
          )
          PY
          then
            if python advanced_validation_lab.py \
              --repo-root . --out-dir /tmp/advanced-validation-lab > /tmp/lab-check.log 2>&1; then
              echo "::error::Lab accepted a missing original frozen target"
              exit 1
            fi
            grep -F "missing required prospective target freeze" /tmp/lab-check.log
            test ! -f /tmp/advanced-validation-lab/advanced_validation_lab_summary.json
            echo "::notice::Scientific inference remains blocked: no original prefrozen candidate #701. Retrospective grading is forbidden."
            exit 0
          fi
          python advanced_validation_lab.py \
            --repo-root . --out-dir /tmp/advanced-validation-lab
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("/tmp/advanced-validation-lab/advanced_validation_lab_summary.json").read_text())
          assert x["future_e_monitor"]["verified_prefrozen_draws"]==0
          assert x["future_e_monitor"]["current_e_value"]==1
          assert x["historical_exploratory"]["matched_full_budget_fair_draws"]["worlds"]==32
          assert x["automatic_model_selection"] is False
          assert x["production_changed"] is False
          print("Scientific review:",x["historical_exploratory"]["matched_full_budget_fair_draws"])
          PY
      - name: Classify original pre-freeze provenance before main writes
        if: github.event_name != 'pull_request'
        id: provenance
        shell: bash
        run: |
          python research_cycle_provenance_recovery.py \
            --repo-root . --github-output "$GITHUB_OUTPUT"
      - name: Report missing original freeze as blocked (no fabricated science)
        if: github.event_name != 'pull_request' && steps.provenance.outputs.status == 'BLOCKED_MISSING_PREFROZEN_701'
        shell: bash
        run: |
          echo "::warning::Statistical lab blocked: original pre-draw target 701 is missing. A later retry cannot reconstruct prospective evidence."
          echo "## Lab safety stop: original prefrozen #701 absent" >> "$GITHUB_STEP_SUMMARY"
          echo "No future e-process or scientific summary was rewritten. Only a separately registered forward-only protocol can use genuinely unseen results." >> "$GITHUB_STEP_SUMMARY"
          git diff --exit-code -- loto7.csv loto7_agent_output/
      - name: Commit ONLY lab-owned research registration and report
        if: github.event_name != 'pull_request' && steps.provenance.outputs.status != 'BLOCKED_MISSING_PREFROZEN_701'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "loto7-ai-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python advanced_validation_lab.py --repo-root . --out-dir loto7_agent_output
            git add -- \
              loto7_agent_output/advanced_validation_lab_registration.json \
              loto7_agent_output/advanced_validation_lab_summary.json \
              loto7_agent_output/advanced_validation_lab_report.md
            # Fail rather than publishing any unintended output.
            unexpected="$(git diff --cached --name-only | grep -Ev '^loto7_agent_output/advanced_validation_lab_(registration.json|summary.json|report.md)$' || true)"
            test -z "$unexpected" || { echo "::error::Unsafe staged path: $unexpected"; exit 1; }
            if git diff --cached --quiet; then
              echo "Identical research state; no commit."
              exit 0
            fi
            git commit -m "chore: update preregistered advanced scientific validation"
            if git push origin HEAD:main; then
              echo "Safe advanced research evidence persisted."
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Cannot persist scientific audit after bounded retries."
              exit 1
            fi
          done
      - name: Confirm scientific catch-up and research-cycle readiness
        if: github.event_name != 'pull_request' && steps.provenance.outputs.status != 'BLOCKED_MISSING_PREFROZEN_701'
        shell: bash
        run: |
          python research_cycle_provenance_recovery.py --repo-root .
          # WAIT_FOR_NEW_DATA is an expected research budget state.
          # No further optimizer is authorized by this recovery.
      - name: Show inference limits
        if: always()
        run: |
          {
            echo "## Advanced statistical validation (research only)"
            cat loto7_agent_output/advanced_validation_lab_report.md 2>/dev/null || \
              cat /tmp/advanced-validation-lab/advanced_validation_lab_report.md 2>/dev/null || true
            echo
            echo "Only new laboratory-owned reports can be written. No changes to predictive code, frozen experiments, Champion or Production."
          } >> "$GITHUB_STEP_SUMMARY"
