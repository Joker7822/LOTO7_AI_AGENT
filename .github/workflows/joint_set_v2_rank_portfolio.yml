name: Joint Set v2 Rank-Aware Portfolio

on:
  pull_request:
    paths:
      - "joint_set_v2_rank_portfolio.py"
      - "tests/test_joint_set_v2_rank_portfolio.py"
      - ".github/workflows/joint_set_v2_rank_portfolio.yml"
      - "joint_set_v2_model.py"
      - "joint_set_v2_research.py"
  push:
    branches: [main]
    paths:
      - "joint_set_v2_rank_portfolio.py"
      - "tests/test_joint_set_v2_rank_portfolio.py"
      - ".github/workflows/joint_set_v2_rank_portfolio.yml"
      - "joint_set_v2_model.py"
      - "joint_set_v2_research.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: joint-set-v2-rank-aware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rank-aware-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Tokyo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Verify rank-aware portfolio implementation
        run: |
          python -m compileall -q joint_set_v2_rank_portfolio.py tests/test_joint_set_v2_rank_portfolio.py
          python -m pytest -q tests/test_joint_set_v2_rank_portfolio.py

      - name: Run strict nested rank-aware portfolio research
        run: |
          python joint_set_v2_rank_portfolio.py \
            --csv loto7.csv \
            --out-dir loto7_agent_output \
            --min-train 100 \
            --last-n 60 \
            --config-selection-window 120 \
            --policy-selection-window 120 \
            --validation-scenarios 256 \
            --validation-candidates 64 \
            --random-reps 4096

      - name: Commit Research-only outputs
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "loto7-ai-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            loto7_agent_output/joint_set_v2_rank_portfolio_summary.json \
            loto7_agent_output/joint_set_v2_rank_portfolio.csv \
            loto7_agent_output/joint_set_v2_rank_portfolio_report.md \
            loto7_agent_output/joint_set_v2_rank_portfolio_current.json
          if [ -n "$(git status --porcelain -- loto7_agent_output)" ]; then
            git commit -m "chore: update v2 rank-aware portfolio research"
            git pull --rebase
            git push
          fi

      - name: Show result
        if: success()
        shell: bash
        run: |
          cat loto7_agent_output/joint_set_v2_rank_portfolio_report.md >> "$GITHUB_STEP_SUMMARY"
