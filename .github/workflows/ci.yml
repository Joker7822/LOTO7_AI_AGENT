name: LOTO7 Agent CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "tests/**"
      - "requirements.txt"
      - "sakura/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard uncommitted Sakura secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -f sakura/prediction_ingest_config.php ]; then
            echo "ERROR: sakura/prediction_ingest_config.php must never be committed."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Record exact test-environment package versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/loto7-env"
          python --version > "${RUNNER_TEMP}/loto7-env/python-version.txt" 2>&1
          python -m pip freeze --all | sort > "${RUNNER_TEMP}/loto7-env/pip-freeze.txt"
          python -m pip check

      - name: Compile
        run: python -m compileall -q .
      - name: Verify newest actual draw, trusted OOS boundaries and autonomous safety
        run: python -m pytest -q tests/test_live_evidence_boundaries.py tests/test_autonomous_evolution_lab.py
      - name: Full historical regression suite on isolated pinned 699 evidence
        run: bash scripts/ci_verify_frozen_regressions.sh
      - name: Archive CI dependency provenance (even on test failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loto7-python-environment-${{ github.run_id }}
          path: ${{ runner.temp }}/loto7-env/
          if-no-files-found: warn
          retention-days: 30
