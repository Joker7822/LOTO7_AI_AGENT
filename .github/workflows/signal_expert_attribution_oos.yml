name: Signal Expert Attribution Future OOS

on:
  push:
    branches: [main]
    paths:
      - "signal_expert_attribution_oos.py"
      - "loto7.csv"
      - "loto7_evolving_agent.py"
      - "loto7_v2_runner.py"
      - "loto7_v4_runner.py"
      - "separated_optimizer.py"
      - "loto7_agent_output/source_validation.json"
      - "loto7_agent_output/champion_calibration_oos_registry.json"
      - ".github/workflows/signal_expert_attribution_oos.yml"
  schedule:
    - cron: "5 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signal-expert-attribution-future-oos
  cancel-in-progress: false

jobs:
  freeze-grade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Verify protocol
        run: |
          python -m compileall -q signal_expert_attribution_oos.py tests/test_signal_expert_attribution_oos.py
          python -m pytest -q tests/test_signal_expert_attribution_oos.py

      - name: Freeze grade and persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "loto7-ai-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for ATTEMPT in 1 2 3 4 5; do
            echo "[ATTR-OOS] persist attempt ${ATTEMPT}/5"
            git fetch origin main
            git reset --hard origin/main

            python signal_expert_attribution_oos.py \
              --csv loto7.csv \
              --out-dir loto7_agent_output \
              --champion-file loto7_agent_output/model_champion.json \
              --source-report loto7_agent_output/source_validation.json \
              --min-train 100

            git add -A -- \
              loto7_agent_output/signal_expert_attribution_registry.json \
              loto7_agent_output/signal_expert_attribution_state.json \
              loto7_agent_output/signal_expert_attribution_summary.csv \
              loto7_agent_output/signal_expert_attribution_freeze_history.jsonl \
              loto7_agent_output/signal_expert_attribution_report.md
            if [ -e loto7_agent_output/signal_expert_attribution_results.csv ]; then
              git add -A -- loto7_agent_output/signal_expert_attribution_results.csv
            fi

            if [ -z "$(git status --porcelain -- loto7_agent_output/signal_expert_attribution_registry.json loto7_agent_output/signal_expert_attribution_state.json loto7_agent_output/signal_expert_attribution_summary.csv loto7_agent_output/signal_expert_attribution_results.csv loto7_agent_output/signal_expert_attribution_freeze_history.jsonl loto7_agent_output/signal_expert_attribution_report.md)" ]; then
              echo "No expert attribution OOS changes."
              exit 0
            fi

            git commit -m "chore: update signal expert attribution Future-OOS"
            if git push origin HEAD:main; then
              echo "[ATTR-OOS] persisted successfully"
              exit 0
            fi
            echo "[ATTR-OOS] main moved during push; recomputing from latest main"
          done

          echo "Signal expert attribution OOS state could not be persisted after 5 attempts." >&2
          exit 1

      - name: Show status
        if: always()
        shell: bash
        run: |
          {
            echo '## Signal expert attribution Future-OOS'
            cat loto7_agent_output/signal_expert_attribution_report.md 2>/dev/null || true
            echo
            echo '## Registry summary'
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path('loto7_agent_output/signal_expert_attribution_registry.json')
          if p.exists():
              r = json.loads(p.read_text(encoding='utf-8'))
              print(json.dumps({
                  'target_round': r.get('target_round'),
                  'frozen_at_jst': r.get('frozen_at_jst'),
                  'expert_count': r.get('expert_count'),
                  'final_q_sha256': r.get('final_q_sha256'),
                  'calibration_shadow_crosscheck': r.get('calibration_shadow_crosscheck'),
              }, ensure_ascii=False, indent=2))
          PY
          } >> "$GITHUB_STEP_SUMMARY"
